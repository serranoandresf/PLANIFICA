// Interpreta frases como "Llamar a Pedro 20 min a las 4pm", "Gym mañana 6 de la mañana 1.5 h", "Dentista el lunes a las 9"
function parseQuick(raw) {
  let s =
      " " +
      String(raw || "")
        .replace(/\s+/g, " ")
        .trim() +
      " ",
    min = null,
    time = null,
    off = 0,
    m;
  const cut = (x) => {
    s = s.replace(x[0], " ");
  };
  if ((m = s.match(/\smedia\s+hora(?=[\s.,;])/i))) {
    min = 30;
    cut(m);
  } else if ((m = s.match(/\s(?:una\s+)?hora\s+y\s+media(?=[\s.,;])/i))) {
    min = 90;
    cut(m);
  } else if ((m = s.match(/\suna\s+hora(?=[\s.,;])/i))) {
    min = 60;
    cut(m);
  } else if (
    (m = s.match(/\s(\d+(?:[.,]\d+)?)\s*(?:h|hr|hrs|hora|horas)(?:\s*(?:y\s*)?(\d{1,2})\s*(?:min|mins|minutos|m))?(?=[\s.,;])/i))
  ) {
    min = Math.round(parseFloat(m[1].replace(",", ".")) * 60 + (m[2] ? +m[2] : 0));
    cut(m);
  } else if ((m = s.match(/\s(\d{1,3})\s*(?:min|mins|minutos|m)(?=[\s.,;])/i))) {
    min = +m[1];
    cut(m);
  }
  if (min !== null && !(min >= 5 && min <= 720)) min = null;
  const setT = (h, mi, ampm, part) => {
    h = +h;
    mi = mi ? +mi : 0;
    const pm = /^p/i.test(ampm || "") || /tarde|noche/i.test(part || ""),
      am = /^a/i.test(ampm || "") || /ma[nñ]ana/i.test(part || "");
    if (pm && h < 12) h += 12;
    else if (pm && h === 12 && /noche/i.test(part || "")) h = 0;
    else if (am && h === 12) h = 0;
    if (h > 23 || mi > 59) return false;
    time = pad(h) + ":" + pad(mi);
    return true;
  };
  if ((m = s.match(/(?:\s+a\s+las?\s+|\s)(\d{1,2})(?::(\d{2}))?\s*(a\.?\s?m\.?|p\.?\s?m\.?)(?=[\s.,;])/i)) && setT(m[1], m[2], m[3], ""))
    cut(m);
  else if (
    (m = s.match(/\s+a\s+las?\s+(\d{1,2})(?::(\d{2}))?(?:\s*(?:h|hrs?))?(?:\s+de\s+la\s+(ma[nñ]ana|tarde|noche))?(?=[\s.,;])/i)) &&
    setT(m[1], m[2], "", m[3])
  )
    cut(m);
  else if ((m = s.match(/\s(\d{1,2})(?::(\d{2}))?\s+de\s+la\s+(ma[nñ]ana|tarde|noche)(?=[\s.,;])/i)) && setT(m[1], m[2], "", m[3])) cut(m);
  else if ((m = s.match(/\smedio\s?d[ií]a(?=[\s.,;])/i))) {
    time = "12:00";
    cut(m);
  } else if ((m = s.match(/\s(\d{1,2}):(\d{2})(?=[\s.,;])/)) && setT(m[1], m[2], "", "")) cut(m);
  const WD = { domingo: 0, lunes: 1, martes: 2, miercoles: 3, jueves: 4, viernes: 5, sabado: 6 };
  if ((m = s.match(/\spasado\s+ma[nñ]ana(?=[\s.,;])/i))) {
    off = 2;
    cut(m);
  } else if ((m = s.match(/\sma[nñ]ana(?=[\s.,;])/i))) {
    off = 1;
    cut(m);
  } else if ((m = s.match(/\shoy(?=[\s.,;])/i))) {
    off = 0;
    cut(m);
  } else if ((m = s.match(/\s(?:el\s+)?(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)(?=[\s.,;])/i))) {
    const k = m[1]
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");
    off = (WD[k] - new Date().getDay() + 7) % 7 || 7;
    cut(m);
  }
  let nm = s.trim();
  for (let n = 0; n < 6; n++) {
    nm = nm
      .replace(/^(?:[.,;:\-–]\s*)+|(?:\s*[.,;:\-–])+$/g, "")
      .replace(/^(?:a|de|del|por|para|el|la|los|las|y|en|durante)\s+/i, "")
      .replace(/\s+(?:a\s+las?|a|de|por|para|el|la|y|en|durante)$/i, "")
      .trim();
  }
  nm = nm.slice(0, 60);
  return { name: nm ? nm[0].toUpperCase() + nm.slice(1) : null, min, time, off };
}
function quickTxt(q) {
  if (!q || !q.name) return "Escribe qué, y si quieres: duración, hora y día (mañana, el lunes).";
  const dur = q.min || (q.time ? 60 : 30);
  return (
    `${q.name} · ${dur} min` +
    (q.time ? ` · a las ${q.time} (compromiso con hora)` : " · pendiente del día") +
    (q.off ? (q.off === 1 ? " · mañana" : q.off === 2 ? " · pasado mañana" : " · en " + q.off + " días") : "")
  );
}
function quickAdd(txt) {
  const q = parseQuick(txt);

  return { key, t, q, dur };
}

// Exportar a calendario (.ics): cada bloque del plan pasa a tu calendario, con recordatorio opcional
const icsEsc = (t) => String(t).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
const icsFold = (l) => {
  const o = [];
  let x = l;
  while (x.length > 73) {
    o.push(x.slice(0, 73));
    x = " " + x.slice(73);
  }
  o.push(x);
  return o.join("\r\n");
};
const icsLocal = (d) => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00";
function buildICS(dias, alarma) {
  const n0 = new Date(),
    stamp =
      n0.getUTCFullYear() +
      pad(n0.getUTCMonth() + 1) +
      pad(n0.getUTCDate()) +
      "T" +
      pad(n0.getUTCHours()) +
      pad(n0.getUTCMinutes()) +
      pad(n0.getUTCSeconds()) +
      "Z";
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//PLANIFICA//ES", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:PLANIFICA"];
  let n = 0;
  dias.forEach(({ key, items }) => {
    const [y, mo, d] = key.split("-").map(Number);
    items.forEach((i) => {
      const st = new Date(y, mo - 1, d, 0, Math.round(i.start), 0),
        en = new Date(y, mo - 1, d, 0, Math.round(i.start) + Math.max(5, Math.round(i.est.block)), 0);
      const nm = (etpl(i.tid, key) || {}).name || tpl(i.tid).name || "Actividad";
      L.push(
        "BEGIN:VEVENT",
        "UID:" + String(i.iid).replace(/[,;\\]/g, "-") + "@planifica",
        "DTSTAMP:" + stamp,
        "DTSTART:" + icsLocal(st),
        "DTEND:" + icsLocal(en),
        "SUMMARY:" + icsEsc(nm),
        "DESCRIPTION:" +
          icsEsc(
            "Estimado " +
              i.est.exp +
              " min (rango " +
              i.est.lo +
              "-" +
              i.est.hi +
              "). Bloque con buffer: " +
              i.est.block +
              " min. Generado por PLANIFICA.",
          ),
      );
      if (alarma) L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(nm), "TRIGGER:-PT5M", "END:VALARM");
      L.push("END:VEVENT");
      n++;
    });
  });
  L.push("END:VCALENDAR");
  return { texto: L.map(icsFold).join("\r\n") + "\r\n", n };
}
function diasICS(cuantos) {
  const out = [],
    base = new Date();
  for (let k = 0; k < cuantos; k++) {
    const d = new Date(base);
    d.setDate(d.getDate() + k);
    const key = dk(d),
      hoy = k === 0;
    const items = (hoy ? today() : preview(key)).filter((i) => !i.fuera && !(hoy && logOf(i.iid)));
    out.push({ key, items });
  }
  return out;
}
A.ics = () =>

  const al = !!($("#ics_al") && $("#ics_al").checked),

  }
  const nombre = "planifica-" + dk() + ".ics";
  let enviado = false;
  try {
    const f = new File([r.texto], nombre, { type: "text/calendar" });
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      navigator.share({ files: [f], title: "PLANIFICA" }).catch(() => {});
      enviado = true;
    }
  } catch (_) {}
  if (!enviado) {
    try {
      const b = new Blob([r.texto], { type: "text/calendar" }),
        a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = nombre;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      enviado = true;
    } catch (_) {}
  }
  closeS();
  toast(enviado ? r.n + " bloques listos para tu calendario" : "No pude crear el archivo en este navegador");
};

/* ===== INSTALACIÓN (PWA) y almacenamiento protegido — Fase 5b ===== */
let DEFER = null,
  PERSIST = null;
const enApp = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
let STO = "";
function stoRefresh() {
  // uso real del almacenamiento, si el navegador lo informa
  if (!(navigator.storage && navigator.storage.estimate)) return;
  navigator.storage
    .estimate()
    .then((e) => {
      const mb = (x) => (x / 1048576).toFixed(1);
      if (e && e.quota) STO = ` Usas ${mb(e.usage || 0)} MB de unos ${mb(e.quota)} MB disponibles.`;
      const el = $("#pst");
      if (el) el.textContent = pstTxt();
    })
    .catch(() => {});
}
function pstTxt() {
  const a = enApp() ? "Abierta como app instalada. " : "";
  const b = S
    ? DBOK
      ? `Base IndexedDB: guarda tus ${S.logs.length} registros y todo lo que agregues. `
      : "Modo reducido (localStorage, límite ~5 MB). "
    : "";
  let p = "";
  if (PERSIST === true) p = "Almacenamiento protegido: el navegador no debería borrar tus datos por falta de espacio.";
  else if (PERSIST === false)
    p = "Almacenamiento NO protegido: el navegador podría borrar tus datos si falta espacio. Exporta tu respaldo cada semana.";
  return a + b + p + STO;
}
