<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>PLANIFICA</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <style>
      /* ===== ESTILOS: tokens claro/oscuro ===== */
      :root {
        --bg: #f5f5f7;
        --card: #fff;
        --tx: #1d1d1f;
        --mu: #6e6e73;
        --bd: #e5e5ea;
        --btn: #000;
        --btx: #fff;
        --ok: #1e7a37;
        --wn: #b25e00;
        --er: #d93025;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #000;
          --card: #1c1c1e;
          --tx: #f5f5f7;
          --mu: #98989d;
          --bd: #2c2c2e;
          --btn: #fff;
          --btx: #000;
          --ok: #32d74b;
          --wn: #ff9f0a;
          --er: #ff6961;
        }
      }
      :root[data-theme="dark"] {
        --bg: #000;
        --card: #1c1c1e;
        --tx: #f5f5f7;
        --mu: #98989d;
        --bd: #2c2c2e;
        --btn: #fff;
        --btx: #000;
        --ok: #32d74b;
        --wn: #ff9f0a;
        --er: #ff6961;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          16px -apple-system,
          "SF Pro Text",
          system-ui,
          sans-serif;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 64px 16px 96px;
      }
      .top {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        left: 0;
        right: 0;
        z-index: 5;
        backdrop-filter: blur(18px);
        background: color-mix(in srgb, var(--bg) 75%, transparent);
        border-bottom: 1px solid var(--bd);
      }
      .top div,
      .tabs div {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
      }
      .tabs {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 5;
        backdrop-filter: blur(18px);
        background: color-mix(in srgb, var(--bg) 80%, transparent);
        border-top: 1px solid var(--bd);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .tabs div {
        padding: 6px 16px;
        justify-content: space-around;
      }
      .tabs button {
        background: none;
        border: 0;
        color: var(--mu);
        font-weight: 600;
        font-size: 12px;
        font-family: inherit;
        padding: 10px 16px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .tabs button.on {
        color: var(--tx);
      }
      h1 {
        font-size: 22px;
        margin: 0;
        letter-spacing: -0.02em;
      }
      h2 {
        font-size: 30px;
        letter-spacing: -0.03em;
        margin: 8px 0 4px;
      }
      .lb {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--mu);
        font-weight: 600;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 24px;
        padding: 18px;
        margin: 12px 0;
        box-shadow: 0 2px 14px rgba(0, 0, 0, 0.05);
      }
      .btn {
        background: var(--btn);
        color: var(--btx);
        border: 0;
        border-radius: 999px;
        padding: 10px 18px;
        font-weight: 600;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
        transition:
          transform 0.1s,
          opacity 0.2s;
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn.s {
        background: transparent;
        color: var(--tx);
        border: 1px solid var(--bd);
      }
      .btn.sm {
        padding: 9px 14px;
        font-size: 13px;
        min-height: 38px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .sp {
        justify-content: space-between;
      }
      .bl {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .tm {
        width: 54px;
        font-variant-numeric: tabular-nums;
        color: var(--mu);
        font-size: 13px;
        padding-top: 2px;
      }
      .bar {
        height: 6px;
        border-radius: 9px;
        background: var(--bd);
        overflow: hidden;
        margin: 6px 0;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--ok);
        width: 0;
      }
      .al {
        border-radius: 16px;
        padding: 12px 14px;
        margin: 10px 0;
        font-size: 14px;
        border: 1px solid var(--wn);
        color: var(--wn);
      }
      .al.e {
        border-color: var(--er);
        color: var(--er);
      }
      .al.g {
        border-color: var(--ok);
        color: var(--ok);
      }
      .mu {
        color: var(--mu);
        font-size: 13px;
      }
      .ok {
        color: var(--ok);
      }
      .wn {
        color: var(--wn);
      }
      input,
      select,
      textarea {
        width: 100%;
        background: var(--bg);
        color: var(--tx);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 10px;
        font: inherit;
        margin: 4px 0 10px;
      }
      .g2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 10px;
      }
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 9;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .ov[hidden] {
        display: none;
      }
      .sh {
        background: var(--card);
        width: 100%;
        max-width: 720px;
        max-height: 88vh;
        overflow: auto;
        border-radius: 24px 24px 0 0;
        padding: 20px 18px calc(24px + env(safe-area-inset-bottom, 0px));
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 90px;
        transform: translateX(-50%);
        background: var(--btn);
        color: var(--btx);
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 14px;
        z-index: 20;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        max-width: 90%;
      }
      #toast.on {
        opacity: 1;
      }
      pre {
        white-space: pre-wrap;
        font:
          13px ui-monospace,
          monospace;
        margin: 0;
      }
      /* Fase 5: respeta "reducir movimiento" del sistema */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--wn);
        outline-offset: 2px;
      }
      button.mc { border: 0; color: var(--tx); font: inherit; font-size: 11px; cursor: pointer; padding: 0; position: relative; }
      .mc sup { font-size: 8px; margin-left: 1px; }
      .big {
        font-size: 54px;
        font-weight: 700;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
      }
    .mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.mc{aspect-ratio:1;border-radius:8px;background:var(--bd);font-size:11px;display:flex;align-items:center;justify-content:center}
.tabs button{padding:10px 5px;font-size:10px;letter-spacing:.03em}
</style>
  </head>
  <body>
    <div class="top">
      <div>
        <h1>PLANIFICA</h1>
        <span class="lb" id="dt"></span>
      </div>
    </div>
    <main id="v"></main>
    <nav class="tabs" aria-label="Navegación">
      <div>
        <button data-a="tab" data-i="hoy">Hoy</button
        ><button data-a="tab" data-i="sem">Semana</button
        ><button data-a="tab" data-i="met">Metas</button
        ><button data-a="tab" data-i="hab">Hábitos</button
        ><button data-a="tab" data-i="act">Actividades</button
        ><button data-a="tab" data-i="aju">Ajustes</button>
      </div>
    </nav>
    <div class="ov" id="ov" hidden role="dialog" aria-modal="true">
      <div class="sh" id="sh"></div>
    </div>
    <div id="toast" role="status"></div>
    <input type="file" id="imp" accept="application/json" hidden />

    <script>
      /* ===== CONFIGURACIÓN ===== */
      const KEY = "planifica_v2";
      const CATS = [
        "ejercicio",
        "idiomas",
        "lectura",
        "trabajo",
        "proyectos",
        "comida",
        "desplazamiento",
        "recuperación",
        "hogar",
      ];
      const CV0 = 0.15; // variabilidad previa (sin datos): 15%
      const K_PESO = 5; // w = n/(n+5)
      const ALFA = 0.3; // media móvil exponencial
      const FAT_SERIE = 0.04; // el ritmo decae 4% por serie
      const $ = (s) => document.querySelector(s);
      const pad = (n) => String(n).padStart(2, "0");
      const hm = (m) => {
        m = Math.round(m);
        return pad(Math.floor(m / 60) % 24) + ":" + pad(m % 60);
      };
      const tm = (s) => {
        const [a, b] = s.split(":");
        return +a * 60 + +b;
      };
      const dk = (d = new Date()) =>
        d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      // Dormir: objetivo (sleep) y límite absoluto (hard, puede ser pasada la medianoche → minutos > 1440)
      const SL = () => {
        let s = tm(S.cfg.sleep);
        if (s <= tm(S.cfg.wake)) s += 1440;
        return s;
      };
      const HD = () => {
        let h = tm(S.cfg.hard || "00:30");
        if (h <= tm(S.cfg.wake)) h += 1440;
        return Math.max(h, SL());
      };
      const limOf = (k) => (S.ext && S.ext[k] ? HD() : SL()); // el límite absoluto solo se usa si lo confirmas ese día
      const rp = () => {
        genPlan(dk());
      }; // reajusta hoy conservando lo ya hecho
      let YES = null;
      const ask = (m, fn) => {
        YES = fn;
        sheet(
          `<h2>${esc(m)}</h2><div class="row"><button class="btn" data-a="yes">Sí</button><button class="btn s" data-a="close">No</button></div>`,
        );
      };
      function importTxt(t) {
        try {
          const nuevo = norm(JSON.parse(t));
          const dias = new Set(nuevo.logs.map((l) => l.date)).size;
          // Nada se reemplaza hasta que confirmes; antes se muestra qué contiene el archivo
          ask(
            `Importar respaldo: ${nuevo.logs.length} registros en ${dias} días, ${nuevo.tpl.length} actividades, ${nuevo.goals.length} metas. Reemplaza tus datos actuales (queda copia de seguridad en el navegador). ¿Continuar?`,
            () => {
              try {
                copia("preimport", JSON.stringify(S));
              } catch (_) {}
              S = nuevo;
              save();
              applyTheme();
              render();
              toast("Respaldo importado");
            },
          );
        } catch (x) {
          toast("Archivo inválido: no se importó nada");
        }
      }
      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );

      /* ===== DATOS: plantillas de ejemplo (tuyas) ===== */
      const T = (id, name, cat, base, prep, trans, energy, win, x = {}) => ({
        id,
        name,
        cat,
        base,
        prep,
        trans,
        energy,
        type: "normal",
        prio: 2,
        freq: "diaria",
        win,
        ...x,
      });
      const S1 = (n, sets, reps, secRep, rest) => ({
          n,
          k: "series",
          sets,
          reps,
          secRep,
          rest,
        }),
        M = (n, min) => ({ n, k: "tiempo", min });
      function seed() {
        return {
          cfg: {
            wake: "06:30",
            sleep: "23:00",
            hard: "00:30",
            theme: null,
            lastBackup: 0,
          },
          tpl: [
            T("ej", "Ejercicio", "ejercicio", 0, 10, 10, 3, "06:45", {
              prio: 1,
              winD: { 6: "15:30" },
              type: "rutina",
              items: [
                M("Calentamiento", 8),
                S1("Flexiones (100)", 5, 20, 2.5, 60),
                S1("Sentadillas", 4, 20, 2.5, 60),
                S1("Plancha", 3, 1, 45, 45),
                M("Cardio", 20),
                M("Estiramiento", 7),
              ],
            }),
            T("sn", "Snack previo", "comida", 5, 0, 0, 1, "06:30", { prio: 1 }),
            T("co", "Comida", "comida", 25, 0, 5, 1, "08:30,12:45,20:00", {
              prio: 1,
            }),
            T("fo", "Foco profundo", "trabajo", 90, 5, 5, 3, "09:00,11:30", {
              prio: 1,
              rest: 10,
              days: [1, 2, 3, 4, 5],
            }),
            T("fos", "Trabajo sábado (4 h antes del mediodía)", "trabajo", 90, 5, 5, 3, "06:40,09:25", {
              prio: 1,
              rest: 10,
              days: [6],
            }),
            T(
              "op",
              "Trabajo operativo",
              "trabajo",
              105,
              0,
              5,
              2,
              "13:45,16:00",
              { prio: 1, rest: 10, days: [1, 2, 3, 4, 5] },
            ),
            T("sw", "SW corto", "recuperación", 15, 2, 0, 1, "17:30,21:50", {
              prio: 3,
            }),
            T("ing", "Inglés", "idiomas", 0, 5, 5, 2, "18:00", {
              type: "rutina",
              items: [
                M("Vocabulario y repaso", 10),
                M("Escucha activa", 20),
                M("Hablar o escribir", 20),
                M("Corregir errores", 10),
              ],
            }),
            T("pr", "Proyectos propios", "proyectos", 0, 5, 5, 3, "19:15", {
              prio: 3,
              type: "rutina",
              days: [6, 0],
              items: [
                M("Definir siguiente paso", 5),
                M("Trabajo enfocado", 35),
                M("Anotar avance", 5),
              ],
            }),
            T("lec", "Lectura", "lectura", 0, 2, 0, 1, "20:40", {
              type: "rutina",
              items: [M("Lectura continua", 50), M("Notas y subrayado", 10)],
            }),
            T(
              "des",
              "Desplazamiento (bajo demanda)",
              "desplazamiento",
              30,
              3,
              0,
              1,
              "",
              { freq: "demanda" },
            ),
          ],
          plan: {},
          logs: [],
          cal: {},
          timer: null,
          extra: {},
          rm: {},
          add: {},
          ext: {},
          pend: [],
          en: [], goals: [], hd: {}, rev: [], notes: {}, pin: {}, ov: {}, v: 6,
        };
      } // en = chequeos de energía [{ts,v(1-5)}]

      /* ===== ESTADO + persistencia con validación ===== */
      let S,
        TAB = "hoy";
      // Normaliza y migra a esquema v3 (copia previa en _pre3); lanza error si el archivo no sirve
      // Normaliza componentes de una rutina: descarta lo inválido y acota valores absurdos
      function cleanItems(a) {
        return (Array.isArray(a) ? a : []).map((i) => {
          if (!i || typeof i !== "object") return null;
          const n = String(i.n || "").slice(0, 60).trim();
          if (!n) return null;
          if (i.k === "series") {
            const sets = Math.round(+i.sets), reps = Math.round(+i.reps);
            if (!(sets >= 1 && sets <= 50 && reps >= 1 && reps <= 1000)) return null;
            return { n, k: "series", sets, reps, secRep: Math.min(60, Math.max(0.5, +i.secRep || 2.5)), rest: Math.min(900, Math.max(0, +i.rest >= 0 ? +i.rest : 60)) };
          }
          const min = +i.min;
          return min > 0 && min <= 600 ? { n, k: "tiempo", min } : null;
        }).filter(Boolean);
      }
      function norm(o, raw) {
        if (!o || !Array.isArray(o.tpl) || !Array.isArray(o.logs) || !o.cfg)
          throw 0;
        if (
          o.tpl.some(
            (x) => !x || typeof x.id !== "string" || typeof x.name !== "string",
          )
        )
          throw 0;
        if (o.v > 6) throw 0; // versión más nueva que esta app: no la degradamos en silencio
        if (raw && (o.v || 0) < 5)
          try {
            copia("pre5", raw); // copia previa a migrar (una sola vez)
          } catch (_) {}
        o.cfg = {
          wake: "06:30",
          sleep: "23:00",
          hard: "00:30",
          theme: null,
          lastBackup: 0,
          ...o.cfg,
        };
        ["plan", "cal", "extra", "rm", "add", "ext"].forEach((k) => {
          if (!o[k] || typeof o[k] !== "object" || Array.isArray(o[k]))
            o[k] = {};
        });
        if (!Array.isArray(o.pend)) o.pend = [];
        o.en = (Array.isArray(o.en) ? o.en : [])
          .filter((e) => e && isFinite(+e.ts) && +e.v >= 1 && +e.v <= 5)
          .slice(-400); // energía: últimos 400 chequeos
        o.logs = o.logs.filter(
          (l) =>
            l &&
            typeof l.date === "string" &&
            typeof l.tid === "string" &&
            isFinite(+l.real),
        ); // descarta registros dañados
        const dias = Object.keys(o.plan).sort(),
          viejo = dk(new Date(Date.now() - 14 * 864e5));
        dias.forEach((k) => {
          if (k < viejo) delete o.plan[k];
        }); // los planes viejos no se necesitan: el historial está en logs
        o.tpl.forEach((t) => {
          delete t.scale;
          t.id = t.id.replace(/[^\w-]/g, "_");
          if (!CATS.includes(t.cat)) t.cat = "hogar";
          if (!["diaria", "lv", "fs", "demanda"].includes(t.freq))
            t.freq = "diaria";
          t.win = String(t.win || "")
            .split(",")
            .map((x) => x.trim())
            .filter((x) => /^([01]?\d|2[0-3]):[0-5]\d$/.test(x))
            .join(",");
          t.cat = String(t.cat || "hogar");
          t.items = cleanItems(t.items);
          t.win = String(t.win || "");
          t.rest = +t.rest || 0;
          t.base = +t.base || 1;
          t.prep = +t.prep || 0;
          t.trans = +t.trans || 0;
          t.energy = +t.energy || 2;
          t.prio = +t.prio || 2;
          t.freq = t.freq || "diaria"; t.days = Array.isArray(t.days) ? [...new Set(t.days.map(Number).filter((d) => d >= 0 && d <= 6))] : [];
          t.type = t.type || "normal";
          // winD (Fase 5): {día:'HH:MM,HH:MM'} ventana distinta según el día de la semana
          if (t.winD && typeof t.winD === "object" && !Array.isArray(t.winD)) {
            const w = {};
            Object.keys(t.winD).forEach((k) => {
              const v = String(t.winD[k]).split(",").map((x) => x.trim()).filter((x) => /^([01]?\d|2[0-3]):[0-5]\d$/.test(x)).join(",");
              if (+k >= 0 && +k <= 6 && v) w[k] = v;
            });
            if (Object.keys(w).length) t.winD = w; else delete t.winD;
          } else delete t.winD;
        });
        if (o.pg !== 2) {
          if (!o.logs.some((l) => l.date === dk())) o.plan = {};
          o.pg = 2;
        }
        delete o.pv;
        if (!Array.isArray(o.goals)) o.goals = []; if (!o.hd || typeof o.hd !== "object" || Array.isArray(o.hd)) o.hd = {}; if (!Array.isArray(o.rev)) o.rev = []; o.goals = o.goals.filter((g) => g && typeof g.id === "string" && g.target > 0 && g.u > 0 && /^\d{4}-\d\d-\d\d$/.test(g.date || "")); // v4: metas
          // v5 (Fase 5): trabajo L-V + sábado 4 h; proyectos propios en fin de semana.
          // Solo toca plantillas que siguen sin editar (diaria y sin días fijos) y nunca borra datos.
          if ((o.v || 0) < 5) {
            const f = (id) => o.tpl.find((t) => t.id === id);
            let cambio = false;
            ["fo", "op"].forEach((id) => {
              const t = f(id);
              if (t && t.freq === "diaria" && !t.days.length) {
                t.days = [1, 2, 3, 4, 5];
                cambio = true;
              }
            });
            const ej = f("ej");
            if (ej && ej.win === "06:45" && !ej.winD) {
              ej.winD = { 6: "15:30" }; // sábado: la mañana es para el trabajo
              cambio = true;
            }
            const pr = f("pr");
            if (pr && pr.freq === "diaria" && !pr.days.length) {
              pr.days = [6, 0];
              cambio = true;
            }
            if (f("fo") && f("fo").days.join() === "1,2,3,4,5" && !f("fos"))
              o.tpl.push(
                T("fos", "Trabajo sábado (4 h antes del mediodía)", "trabajo", 90, 5, 5, 3, "06:40,09:25", { prio: 1, rest: 10, days: [6] }),
              );
            if (cambio && raw) o.note5 = 1; // avisa una vez al cargar
          }

      let DEFER = null, PERSIST = null;
      const enApp = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
      let STO = "";

          const mb = (x) => (x / 1048576).toFixed(1);
          if (e && e.quota) STO = ` Usas ${mb(e.usage || 0)} MB de unos ${mb(e.quota)} MB disponibles.`;

        let p = "";
        if (PERSIST === true) p = "Almacenamiento protegido: el navegador no debería borrar tus datos por falta de espacio.";
        else if (PERSIST === false) p = "Almacenamiento NO protegido: el navegador podría borrar tus datos si falta espacio. Exporta tu respaldo cada semana.";
