<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planifica</title>
<meta name="description" content="Planificador diario que aprende cuánto tardas de verdad en cada cosa.">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planifica">
<style>
/* =====================================================================
   PLANIFICA · sistema de diseño
   Papel frío y tinta. Un solo color de señal (--accent), reservado para
   lo que está pasando ahora. Superficies planas, sin sombras decorativas.
   ===================================================================== */
:root {
  color-scheme: light dark;
  --bg: light-dark(#f2f2f7, #000000);
  --s1: light-dark(#ffffff, #1c1c1e);
  --s2: light-dark(#f2f2f7, #2c2c2e);
  --s3: light-dark(#e5e5ea, #3a3a3c);
  --tx: light-dark(#000000, #ffffff);
  --mu: light-dark(#636366, #98989f);
  --bd: light-dark(#d1d1d6, #38383a);
  --accent: #0071e3;
  --accent-tx: light-dark(#0062c4, #64acff);
  --on-accent: #ffffff;
  --ok: light-dark(#126c37, #30d158);
  --wn: light-dark(#9a4a08, #ff9f0a);
  --er: light-dark(#bd241d, #ff6961);
  --r1: 12px; --r2: 18px; --r3: 28px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --top-h: 56px; --nav-h: 64px; --rail: 224px;
  --font: -apple-system, "SF Pro Text", "SF Pro Display", BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
:root[data-accent="cobalto"] { --accent: #5856d6; --accent-tx: light-dark(#4a48c4, #a3a1ff); }
:root[data-accent="jade"] { --accent: #1c7f36; --accent-tx: light-dark(#166a2c, #4cd26d); }
:root[data-accent="violeta"] { --accent: #9a3fd0; --accent-tx: light-dark(#8030b8, #d29cff); }
:root[data-accent="rosa"] { --accent: #d6174a; --accent-tx: light-dark(#b9103d, #ff7a9c); }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--sat) + var(--top-h) + 12px); }
body { margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; letter-spacing: -0.006em; -webkit-tap-highlight-color: transparent; }
body.noscroll { overflow: hidden; }
button { font: inherit; color: inherit; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 100; background: var(--tx); color: var(--bg); padding: 10px 14px; border-radius: var(--r1); font-weight: 600; }
.skip:focus { top: calc(var(--sat) + 8px); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }

/* ---------- Estructura ---------- */
.top { position: sticky; top: 0; z-index: 20; padding-top: var(--sat); background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: saturate(1.5) blur(18px); -webkit-backdrop-filter: saturate(1.5) blur(18px); border-bottom: 1px solid color-mix(in srgb, var(--bd) 60%, transparent); }
.top-in { max-width: 760px; margin: 0 auto; height: var(--top-h); padding: 0 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
.brand .mk { width: 28px; height: 28px; border-radius: 9px; background: var(--tx); color: var(--bg); display: grid; place-items: center; }
.brand .mk .ic { width: 16px; height: 16px; stroke-width: 2.6; }
#dt { color: var(--mu); font-size: 13.5px; font-weight: 500; }
#dt::first-letter { text-transform: uppercase; }
main { max-width: 760px; margin: 0 auto; padding: 14px 16px calc(var(--nav-h) + var(--sab) + 32px); outline: 0; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: space-around; padding: 6px 8px calc(6px + var(--sab)); background: color-mix(in srgb, var(--s1) 88%, transparent); backdrop-filter: saturate(1.5) blur(18px); -webkit-backdrop-filter: saturate(1.5) blur(18px); border-top: 1px solid color-mix(in srgb, var(--bd) 70%, transparent); }
.nav-brand { display: none; }
.nav button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px; border: 0; background: transparent; color: var(--mu); font-size: 11px; font-weight: 600; line-height: 1.1; cursor: pointer; border-radius: 14px; }
.nav .nv { display: grid; place-items: center; width: 54px; height: 30px; border-radius: 999px; transition: background .2s; }
.nav .ic { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--tx); }
.nav button[aria-current="page"] .nv { background: var(--accent); color: var(--on-accent); }
@media (min-width: 900px) {
  #app { padding-left: var(--rail); }
  .nav { top: 0; right: auto; bottom: 0; width: var(--rail); flex-direction: column; justify-content: flex-start; gap: 4px; padding: calc(18px + var(--sat)) 14px 18px; border-top: 0; border-right: 1px solid var(--bd); background: var(--s1); }
  .nav-brand { display: flex; margin: 0 6px 18px; }
  .nav button { flex: none; flex-direction: row; gap: 12px; padding: 4px 8px 4px 4px; font-size: 14.5px; text-align: left; }
  .nav .nv { width: 40px; height: 36px; border-radius: 12px; }
  .nav button:hover:not([aria-current="page"]) .nv { background: var(--s2); }
  .top-in .brand { display: none; }
  .top-in, main { max-width: 820px; }
  main { padding-bottom: 60px; }
  #toast { bottom: 28px; }
}

/* ---------- Iconos ---------- */
.ic { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
.ic.fill { fill: currentColor; stroke-width: 1; }
.ic.dots { stroke-width: 3.2; }

/* ---------- Tipografía y utilidades ---------- */
h2, .pg { text-wrap: balance; font-size: 28px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.12; margin: 4px 0 2px; }
.pg::first-letter { text-transform: uppercase; }
h3 { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px; }
p { margin: 8px 0; }
.lb { display: block; font-size: 12.5px; font-weight: 600; color: var(--mu); letter-spacing: 0; }
label.lb { margin: 0 0 4px; }
.mu { color: var(--mu); font-size: 13px; line-height: 1.45; }
.ok { color: var(--ok); } .wn { color: var(--wn); } .er { color: var(--er); }
.tn { font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.nw { flex-wrap: nowrap; }
.sp { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.mt { margin-top: 12px; } .mt2 { margin-top: 20px; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sec { margin: 26px 2px 8px; font-size: 13px; font-weight: 700; color: var(--mu); }
pre { white-space: pre-wrap; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin: 0; }
hr { border: 0; border-top: 1px solid var(--bd); margin: 16px 0; }

/* ---------- Superficies ---------- */
.card { position: relative; background: var(--s1); border: 1px solid var(--bd); border-radius: var(--r2); padding: 16px; margin: 10px 0; }
.card.flat { background: transparent; }
.card.in { background: var(--s2); border-color: transparent; }
.pad0 { padding: 0; overflow: hidden; }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 46px; padding: 0 20px; border: 0; border-radius: 15px; background: var(--tx); color: var(--bg); font-size: 15px; font-weight: 650; letter-spacing: -0.01em; cursor: pointer; transition: transform .12s, opacity .2s, background .2s; text-decoration: none; }
.btn:active { transform: scale(.97); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.s { background: var(--s2); color: var(--tx); box-shadow: inset 0 0 0 1.5px var(--bd); }
.btn.a { background: var(--accent); color: var(--on-accent); }
.btn.d { background: color-mix(in srgb, var(--er) 12%, var(--s1)); color: var(--er); box-shadow: none; }
.btn.t { background: transparent; color: var(--tx); box-shadow: none; padding: 0 10px; }
.btn.s[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--tx); }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 13.5px; border-radius: 12px; }
.btn.ic-only { padding: 0; width: 46px; }
.btn.sm.ic-only { width: 38px; }
.btn.blk { width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; background: var(--s2); color: var(--mu); font-size: 12px; font-weight: 650; white-space: nowrap; box-shadow: inset 0 0 0 1px var(--bd); }
.chip.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--s1)); box-shadow: none; }
.chip.wn { color: var(--wn); background: color-mix(in srgb, var(--wn) 14%, var(--s1)); box-shadow: none; }
.chip.er { color: var(--er); background: color-mix(in srgb, var(--er) 13%, var(--s1)); box-shadow: none; }
.chip.ac { color: var(--on-accent); background: var(--accent); box-shadow: none; }
.chip .ic { width: 14px; height: 14px; }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 14px; background: var(--s3); }
.seg button { flex: 1; min-height: 36px; padding: 0 12px; border: 0; border-radius: 11px; background: transparent; color: var(--mu); font-size: 13.5px; font-weight: 650; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--s1); color: var(--tx); box-shadow: 0 1px 3px rgba(0,0,0,.14); }

/* ---------- Formularios ---------- */
input, select, textarea { display: block; width: 100%; min-height: 46px; margin: 0 0 12px; padding: 0 13px; border: 1.5px solid transparent; border-radius: var(--r1); background: var(--s2); color: var(--tx); font: inherit; font-size: 16px; }
textarea { padding: 11px 13px; min-height: 0; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); background: var(--s1); }
input[type="radio"], input[type="checkbox"] { display: inline-block; width: 20px; height: 20px; min-height: 0; padding: 0; margin: 1px 10px 0 0; flex: none; accent-color: var(--accent); }
label.row { display: flex; flex-wrap: nowrap; align-items: flex-start; gap: 0; padding: 6px 0; line-height: 1.35; font-size: 14.5px; }
input[type="range"] { padding: 0; accent-color: var(--accent); }
.qa { display: flex; align-items: center; gap: 6px; padding: 5px 5px 5px 16px; border-radius: 18px; margin: 12px 0 4px; background: var(--s1); border: 1.5px solid var(--bd); }
.qa:focus-within { border-color: var(--accent); }
.qa .ic { color: var(--accent-tx); }
.qa input { flex: 1; min-width: 0; margin: 0; padding: 0; min-height: 42px; background: transparent !important; border: 0 !important; }
.qp { min-height: 0; padding: 0 6px; margin: 0 0 6px; }
.qp:empty { display: none; }

/* ---------- Avisos ---------- */
.al { display: block; margin: 8px 0; padding: 12px 14px; border-radius: 14px; font-size: 14px; line-height: 1.42; background: color-mix(in srgb, var(--wn) 12%, var(--s1)); border-left: 4px solid var(--wn); }
.al.e { background: color-mix(in srgb, var(--er) 11%, var(--s1)); border-left-color: var(--er); }
.al.g { background: color-mix(in srgb, var(--ok) 11%, var(--s1)); border-left-color: var(--ok); }
.al b { font-weight: 700; }
.al .btn { margin-top: 8px; margin-right: 6px; }
details.fold { margin: 10px 0; border: 1px solid var(--bd); border-radius: var(--r2); background: var(--s1); }
details.fold > summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 13px 16px; cursor: pointer; list-style: none; font-weight: 650; font-size: 14.5px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: ""; width: 9px; height: 9px; border-right: 2px solid var(--mu); border-bottom: 2px solid var(--mu); transform: rotate(45deg) translateY(-2px); transition: transform .2s; }
details.fold[open] > summary::after { transform: rotate(-135deg); }
details.fold > .fb { padding: 0 16px 12px; }
details.fold.crit { border-color: var(--er); }

/* ---------- Barras, anillo, mapa de calor ---------- */
.bar { height: 8px; border-radius: 8px; background: var(--s3); overflow: hidden; margin: 6px 0; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: inherit; transition: width .4s ease; }
.bar.ac > i { background: var(--accent); }
.bar.wn > i { background: var(--wn); }
.cb { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 13.5px; }
.cb .nm { width: 108px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cb .tr { flex: 1; margin: 0; }
.ring { display: block; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); grid-auto-columns: 1fr; gap: 3px; }
.heat i { aspect-ratio: 1; border-radius: 4px; background: var(--s3); min-width: 0; }
.heat i.now { outline: 2px solid var(--tx); outline-offset: 1px; }
.wbars { display: flex; align-items: stretch; gap: 8px; height: 130px; margin: 10px 0 4px; }
.wbars > div { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--mu); }
.wbars .trk { flex: 1; width: 100%; max-width: 34px; display: flex; align-items: flex-end; min-height: 0; }
.wbars i { display: block; width: 100%; background: var(--accent); border-radius: 6px 6px 3px 3px; min-height: 3px; }

/* ---------- Hoy: resumen ---------- */
.sum { display: flex; align-items: center; gap: 16px; padding: 18px; }
.sum .n { font-size: 46px; font-weight: 800; letter-spacing: -0.06em; line-height: 1; font-variant-numeric: tabular-nums; }
.sum .n small { font-size: 22px; color: var(--mu); font-weight: 700; letter-spacing: -0.03em; margin-left: 2px; }
.voz { margin: 12px 2px 4px; font-size: 14.5px; line-height: 1.45; }
.voz b { font-weight: 750; }

/* ---------- Hero (ahora) y temporizador ---------- */
.hero { position: relative; overflow: hidden; background: var(--tx); color: var(--bg); border: 0; border-radius: var(--r3); padding: 22px 20px 20px; margin: 14px 0; }
.hero::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--ac, var(--accent)); }
.hero .mu, .hero .lb { color: color-mix(in srgb, var(--bg) 66%, transparent); }
.hero .name { font-size: 29px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.08; margin: 4px 0 8px; overflow-wrap: anywhere; }
.hero .btn { background: var(--accent); color: var(--on-accent); }
.hero .btn.s { background: color-mix(in srgb, var(--bg) 16%, transparent); color: var(--bg); box-shadow: none; }
.hero .bar { background: color-mix(in srgb, var(--bg) 22%, transparent); }
.hero .bar > i { background: var(--accent); }
.hero .al { color: var(--tx); }
.big { font-size: clamp(56px, 19vw, 88px); font-weight: 800; letter-spacing: -0.06em; line-height: 1; font-variant-numeric: tabular-nums; margin: 6px 0 10px; }
.tcard .chk { margin: 14px 0 4px; display: grid; gap: 4px; }
.tcard .chk div { display: flex; gap: 10px; align-items: baseline; font-size: 14.5px; color: color-mix(in srgb, var(--bg) 55%, transparent); }
.tcard .chk div.on { color: var(--bg); font-weight: 650; }
.tcard .chk div.dn { color: var(--ok); }
.tcard .chk .ic { width: 15px; height: 15px; align-self: center; }
.rest { margin: 12px 0 4px; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--bg) 12%, transparent); }
.rest .rt { font-size: 22px; font-weight: 750; font-variant-numeric: tabular-nums; }
body.foco .top, body.foco .nav { display: none; }
body.foco #app { padding-left: 0; }
body.foco main { padding: 0; max-width: none; }
body.foco #v > *:not(.tcard) { display: none; }
body.foco .tcard { position: fixed; inset: 0; z-index: 30; margin: 0; border-radius: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: calc(24px + var(--sat)) 24px calc(24px + var(--sab)); }
body.foco .tcard .big { font-size: min(32vw, 190px); }
body.foco .tcard .row { justify-content: center; }
body.foco .tcard .chk { text-align: left; }

/* ---------- Hoy: línea de tiempo ---------- */
.tl { margin: 18px 0 8px; }
.tr { display: grid; grid-template-columns: 46px 22px minmax(0, 1fr); column-gap: 8px; position: relative; }
.tr .tm { text-align: right; font-size: 12.5px; line-height: 1.3; color: var(--mu); padding-top: 3px; font-variant-numeric: tabular-nums; }
.tr .tm b { display: block; color: var(--tx); font-weight: 700; font-size: 14px; }
.tr .spn { position: relative; }
.tr .spn::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--s3); }
.tr:first-child .spn::before { top: 12px; }
.tr:last-child .spn::before { bottom: auto; height: 12px; }
.tr .nd { position: absolute; left: 50%; top: 5px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--bg); border: 3.5px solid var(--ac, var(--mu)); z-index: 1; }
.tr .bdy { padding: 0 0 20px; min-width: 0; }
.tr.done .nd { background: var(--ok); border-color: var(--ok); }
.tr.done .nd::after { content: ""; position: absolute; left: 3px; top: 0.5px; width: 4px; height: 7px; border: solid var(--bg); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.tr.done .ttl, .tr.done .mu, .tr.skp .ttl, .tr.skp .mu { opacity: .6; }
.tr.skp .nd { border-color: var(--wn); }
.tr.act .nd { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 24%, transparent); }
.tr .ttl { font-size: 16.5px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; overflow-wrap: anywhere; }
.tr .acts { margin-top: 8px; }
.tr.nowl .tm { color: var(--accent-tx); font-weight: 800; }
.tr.nowl .nd { top: 6px; width: 14px; height: 14px; margin-left: -7px; background: var(--accent); border: 0; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 24%, transparent); }
.tr.nowl .bdy { padding: 0 0 12px; display: flex; align-items: center; height: 24px; }
.tr.nowl .bdy::before { content: ""; flex: 1; height: 2px; background: var(--accent); opacity: .55; border-radius: 2px; }
.tr.gap .bdy { padding-bottom: 14px; }
.tr.gap .g { display: inline-flex; gap: 6px; align-items: center; padding: 5px 12px; border: 1.5px dashed var(--s3); border-radius: 999px; color: var(--mu); font-size: 12.5px; }
.tr.gap .nd { display: none; }

/* ---------- Listas agrupadas (actividades, ajustes) ---------- */
.lst { background: var(--s1); border: 1px solid var(--bd); border-radius: var(--r2); margin: 8px 0 14px; overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; padding: 13px 16px; min-height: 54px; border-top: 1px solid var(--bd); }
.li:first-child { border-top: 0; }
.li .dot { width: 12px; height: 12px; border-radius: 4px; background: var(--ac, var(--mu)); flex: none; align-self: flex-start; margin-top: 5px; }
.li .grow b { font-weight: 650; }
.menu { display: grid; gap: 4px; margin: 8px 0; }
.menu button { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 0 14px; border: 0; border-radius: 14px; background: var(--s2); color: var(--tx); font-size: 15.5px; font-weight: 600; text-align: left; cursor: pointer; }
.menu button:active { transform: scale(.985); }
.menu button.dg { color: var(--er); }
.menu .ic { color: var(--mu); }
.menu .dg .ic { color: var(--er); }

/* ---------- Calendario ---------- */
.dnav { display: flex; gap: 8px; align-items: center; margin: 2px 0 6px; }
.dnav .dt { flex: 1; min-height: 44px; justify-content: center; font-weight: 700; }
.wk { display: grid; grid-template-columns: 56px 1fr 22px; gap: 4px 12px; align-items: center; width: 100%; padding: 14px 16px; border: 0; background: transparent; text-align: left; cursor: pointer; }
.wkw + .wkw { border-top: 1px solid var(--bd); }
.wk .d { font-size: 12.5px; color: var(--mu); font-weight: 600; line-height: 1.15; }
.wk .d b { display: block; font-size: 24px; letter-spacing: -0.04em; color: var(--tx); font-weight: 800; }
.wk.hoy .d b { color: var(--accent-tx); }
.wk .bar { margin: 4px 0; }
.wk-x { padding: 0 16px 14px 84px; font-size: 13px; }
.mg { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.mg .h { text-align: center; font-size: 11.5px; font-weight: 700; color: var(--mu); padding-bottom: 2px; }
.mc { position: relative; aspect-ratio: 1; min-height: 40px; border: 0; border-radius: 10px; background: var(--s3); color: var(--tx); font-size: 13.5px; font-weight: 650; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.mc sup { position: absolute; top: 3px; right: 5px; font-size: 9px; color: var(--accent-tx); }
.mc.hoy { outline: 2px solid var(--tx); outline-offset: 1px; }
.mc.mal { box-shadow: inset 0 0 0 2px var(--wn); }

/* ---------- Hojas (modales) ---------- */
.ov { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(6, 8, 16, .5); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fade .18s ease-out; }
.ov[hidden] { display: none; }
.sh { width: 100%; max-width: 560px; max-height: min(90dvh, 860px); overflow: auto; overscroll-behavior: contain; padding: 10px 20px calc(24px + var(--sab)); background: var(--s1); border-radius: var(--r3) var(--r3) 0 0; animation: up .26s cubic-bezier(.2, .85, .25, 1); outline: 0; }
.sh::before { content: ""; display: block; width: 40px; height: 5px; margin: 0 auto 14px; border-radius: 3px; background: var(--s3); }
.sh h2 { font-size: 23px; margin: 0 0 6px; }
@media (min-width: 700px) { .ov { align-items: center; } .sh { border-radius: var(--r3); } }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(24px); opacity: .4; } }

/* ---------- Avisos flotantes ---------- */
#toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--sab) + 18px); transform: translate(-50%, 10px); max-width: min(92vw, 520px); padding: 12px 18px; border-radius: 14px; background: var(--tx); color: var(--bg); font-size: 14px; font-weight: 550; line-height: 1.35; z-index: 60; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#pills { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--sat) + var(--top-h) + 8px); z-index: 61; display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 92vw; pointer-events: none; }
#pills > div { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 6px 6px 6px 16px; border-radius: 999px; background: var(--tx); color: var(--bg); font-size: 14px; font-weight: 550; animation: pin .2s ease-out; }
#pills > div[hidden] { display: none; }
#pills .btn { background: var(--accent); color: var(--on-accent); }
@keyframes pin { from { opacity: 0; transform: translateY(-8px); } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
@media (prefers-contrast: more) { :root { --bd: light-dark(#8a90a8, #5d6684); --mu: light-dark(#3d4358, #c4c9dc); } }
@media (max-width: 380px) { .g2 { grid-template-columns: 1fr; } .sum .n { font-size: 40px; } }
@media print { .nav, .top, #pills, #toast { display: none; } body { background: #fff; color: #000; } }

/* =====================================================================
   CAPA APPLE (iOS): materiales translúcidos, tipografía SF, superficies
   agrupadas, movimiento con resortes. Va al final para ganar a lo anterior.
   ===================================================================== */
:root {
  --spring: cubic-bezier(.32, .72, 0, 1);
  --mat: color-mix(in srgb, var(--s1) 74%, transparent);
  --hair: light-dark(rgba(60, 60, 67, .2), rgba(84, 84, 88, .6));
  --lift: 0 10px 30px -12px rgba(0, 0, 0, .28);
}
body { font: 16px/1.4 var(--font); letter-spacing: -0.016em; }
b, strong { font-weight: 600; }

/* ---- Barra superior: título pequeño que aparece al desplazar (como iOS) ---- */
.top { background: var(--mat); backdrop-filter: saturate(1.8) blur(26px); -webkit-backdrop-filter: saturate(1.8) blur(26px); border-bottom: .5px solid transparent; transition: border-color .25s; }
.top.sc { border-bottom-color: var(--hair); }
.top-in { height: 52px; position: relative; }
.brand { font-size: 17px; font-weight: 650; letter-spacing: -0.022em; transition: opacity .2s; }
.brand .mk { width: 26px; height: 26px; border-radius: 8px; color: var(--on-accent); background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 82%, #fff), color-mix(in srgb, var(--accent) 72%, #000)); box-shadow: inset 0 .5px 0 rgba(255,255,255,.35); }
#dt { font-size: 13px; font-weight: 500; transition: opacity .2s; }
#ttl { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 56%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 17px; font-weight: 650; letter-spacing: -0.022em; opacity: 0; pointer-events: none; transition: opacity .22s; }
.top.sc #ttl { opacity: 1; }
.top.sc .brand, .top.sc #dt { opacity: 0; }
main { padding-top: 6px; }

/* ---- Títulos y secciones ---- */
h2, .pg { font-size: 34px; font-weight: 700; letter-spacing: -0.034em; line-height: 1.08; margin: 8px 2px 4px; }
h3 { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
.sec { margin: 30px 16px 8px; font-size: 13px; font-weight: 600; letter-spacing: -0.005em; }
.lb { font-size: 12.5px; font-weight: 500; }
.voz { font-size: 15px; margin: 8px 4px 6px; color: var(--mu); }
.voz b { color: var(--tx); font-weight: 600; }

/* ---- Superficies ---- */
.card { border: 0; border-radius: 22px; padding: 18px; margin: 12px 0; }
.card.in { background: var(--s2); }
.lst { border: 0; border-radius: 22px; margin: 8px 0 16px; }
.li { border-top: 0; padding: 13px 16px; min-height: 54px; position: relative; }
.li + .li::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--hair); }
.li .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; }
.wkw + .wkw { border-top: .5px solid var(--hair); }
.wk:active { background: var(--s2); }
hr { border-top: .5px solid var(--hair); }
details.fold { border: 0; border-radius: 22px; }
details.fold > summary { padding: 15px 18px; font-weight: 600; font-size: 15.5px; }
details.fold > .fb { padding: 0 18px 14px; }
details.fold.crit { box-shadow: inset 0 0 0 1.5px var(--er); }
.menu { gap: 0; border-radius: 22px; overflow: hidden; background: var(--s1); margin: 10px 0; }
.menu button { border-radius: 0; background: transparent; min-height: 52px; padding: 0 16px; font-weight: 500; font-size: 16px; }
.menu button + button { box-shadow: inset 0 .5px 0 var(--hair); }
.menu button:active { background: var(--s2); transform: none; }
.menu .ic { color: var(--accent-tx); }

/* ---- Botones ---- */
.btn { min-height: 50px; padding: 0 22px; border-radius: 15px; background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 600; letter-spacing: -0.015em; transition: transform .45s var(--spring), filter .2s, opacity .2s, background .2s; }
.btn:active { transform: scale(.955); filter: brightness(.93); transition-duration: .08s; }
.btn.s { background: color-mix(in srgb, var(--accent) 12%, var(--s1)); color: var(--accent-tx); box-shadow: none; }
.btn.s[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.btn.t { background: transparent; color: var(--accent-tx); }
.btn.d { background: color-mix(in srgb, var(--er) 12%, var(--s1)); color: var(--er); }
.btn.sm { min-height: 36px; padding: 0 16px; font-size: 14px; border-radius: 999px; }
.btn.sm.ic-only { width: 36px; padding: 0; }
.chip { background: color-mix(in srgb, var(--mu) 15%, transparent); box-shadow: none; font-weight: 600; padding: 3px 11px; }
.chip.ok { background: color-mix(in srgb, var(--ok) 14%, var(--s1)); }
.chip.ac { background: var(--accent); }
.seg { padding: 2px; border-radius: 10px; background: color-mix(in srgb, var(--mu) 18%, transparent); }
.seg button { min-height: 32px; border-radius: 8px; font-size: 13px; font-weight: 600; transition: background .25s var(--spring), color .2s; }
.seg button[aria-pressed="true"] { background: light-dark(#fff, #636366); color: var(--tx); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.05); }

/* ---- Formularios ---- */
input, select, textarea { border: 0; border-radius: 12px; background: var(--s2); font-size: 17px; transition: box-shadow .2s; }
input:focus, select:focus, textarea:focus { border-color: transparent; background: var(--s2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 38%, transparent); }
.qa { border: 0; border-radius: 16px; padding: 4px 4px 4px 16px; box-shadow: 0 0 0 .5px var(--hair); }
.qa:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 38%, transparent); }

/* ---- Avisos, barras ---- */
.al { border-left: 0; border-radius: 18px; padding: 14px 16px; font-size: 14.5px; background: color-mix(in srgb, var(--wn) 13%, var(--s1)); }
.al.e { background: color-mix(in srgb, var(--er) 11%, var(--s1)); }
.al.g { background: color-mix(in srgb, var(--ok) 12%, var(--s1)); }
.bar { height: 6px; border-radius: 6px; }
.ring circle { stroke-width: 10; }

/* ---- Hoy ---- */
.sum { padding: 20px; }
.sum .n { font-size: 54px; font-weight: 700; letter-spacing: -0.055em; }
.sum .n small { font-weight: 600; font-size: 22px; }
.hero { --tx: #111114; --bg: #f5f5f7; --s1: #ffffff; --s2: #f2f2f7; --s3: #e5e5ea; --mu: #5c5c61;
  color: #f5f5f7; border-radius: 30px; padding: 24px 22px 22px; box-shadow: var(--lift);
  background: radial-gradient(130% 95% at 100% 0%, color-mix(in srgb, var(--ac, var(--accent)) 46%, transparent), transparent 62%), linear-gradient(165deg, #2a2a30, #0e0e11); }
.hero::before { display: none; }
.hero .name { font-size: 30px; font-weight: 700; letter-spacing: -0.035em; }
.big { font-weight: 300; letter-spacing: -0.05em; }
.rest { border-radius: 18px; }

/* ---- Línea de tiempo ---- */
.tr .ttl { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
.tr .nd { border-width: 3px; }
.tr .spn::before { background: color-mix(in srgb, var(--mu) 22%, transparent); }
.tr .tm b { font-weight: 600; }

/* ---- Calendario ---- */
.mc { border-radius: 12px; font-weight: 600; transition: transform .4s var(--spring); }
.mc:active { transform: scale(.92); }
.mc.hoy { outline-color: var(--accent); }
.wk .d b { font-weight: 700; }

/* ---- Hojas modales ---- */
.ov { background: rgba(0, 0, 0, .38); backdrop-filter: none; -webkit-backdrop-filter: none; animation: fade .3s ease-out; }
.sh { border-radius: 30px 30px 0 0; animation: sheetup .55s var(--spring); box-shadow: 0 -12px 50px rgba(0, 0, 0, .2); }
.sh::before { width: 36px; height: 5px; background: color-mix(in srgb, var(--mu) 38%, transparent); }
@media (min-width: 700px) { .sh { border-radius: 30px; } }
@keyframes sheetup { from { transform: translateY(100%); } }

/* ---- Barra inferior tipo iOS ---- */
.nav { background: var(--mat); backdrop-filter: saturate(1.8) blur(26px); -webkit-backdrop-filter: saturate(1.8) blur(26px); border-top: .5px solid var(--hair); padding: 7px 4px calc(3px + var(--sab)); }
.nav button { gap: 3px; padding: 3px 2px 2px; border-radius: 0; font-size: 10.5px; font-weight: 500; letter-spacing: 0; }
.nav .nv { width: auto; height: auto; border-radius: 0; }
.nav .ic { width: 26px; height: 26px; stroke-width: 1.7; transition: transform .5s var(--spring); }
.nav button:active .ic { transform: scale(.86); }
.nav button[aria-current="page"] { color: var(--accent-tx); font-weight: 600; }
.nav button[aria-current="page"] .nv { background: transparent; color: inherit; }
.nav button[aria-current="page"] .ic { stroke-width: 2.15; }
@media (min-width: 900px) {
  .nav { border-top: 0; border-right: .5px solid var(--hair); padding: calc(20px + var(--sat)) 12px 18px; }
  .nav button { padding: 8px 12px; border-radius: 11px; font-size: 15px; font-weight: 500; gap: 11px; }
  .nav .ic { width: 22px; height: 22px; }
  .nav button[aria-current="page"] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .nav button:hover:not([aria-current="page"]) { background: color-mix(in srgb, var(--mu) 12%, transparent); }
  .nav button:hover:not([aria-current="page"]) .nv { background: transparent; }
  #ttl { display: none; }
  .top.sc .brand, .top.sc #dt { opacity: 1; }
}

/* ---- Avisos flotantes con material ---- */
#toast, #pills > div { background: rgba(28, 28, 30, .88); color: #fff; backdrop-filter: blur(22px) saturate(1.8); -webkit-backdrop-filter: blur(22px) saturate(1.8); border-radius: 22px; box-shadow: 0 10px 34px rgba(0, 0, 0, .25); }
#pills > div { border-radius: 999px; }
@keyframes pin { from { opacity: 0; transform: translateY(-10px) scale(.96); } }

/* ---- Entrada escalonada al cambiar de pestaña ---- */
#v.enter > * { animation: rise .55s var(--spring) both; }
#v.enter > *:nth-child(2) { animation-delay: .035s; } #v.enter > *:nth-child(3) { animation-delay: .07s; }
#v.enter > *:nth-child(4) { animation-delay: .105s; } #v.enter > *:nth-child(5) { animation-delay: .14s; }
#v.enter > *:nth-child(n+6) { animation-delay: .17s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .22s; }

/* ---- Ajustes finos ---- */
.seg button { color: color-mix(in srgb, var(--tx) 78%, transparent); }
.chip { color: light-dark(#48484d, #b8b8bf); }
h2, .pg { font-size: clamp(25px, 7.6vw, 34px); }
.dnav .btn.s { background: var(--s1); color: var(--accent-tx); }
.btn[data-a="acento"][aria-pressed="true"] { background: var(--s1); color: var(--tx); box-shadow: inset 0 0 0 2px var(--accent); }
/* Interruptor estilo iOS en lugar de la casilla nativa */
input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; margin: 0 0 0 14px; border-radius: 31px; position: relative; flex: none; cursor: pointer; background: color-mix(in srgb, var(--mu) 32%, transparent); transition: background .3s var(--spring); }
input[type="checkbox"]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .25), 0 0 0 .5px rgba(0, 0, 0, .06); transition: transform .4s var(--spring); }
input[type="checkbox"]:checked { background: var(--ok); }
input[type="checkbox"]:checked::after { transform: translateX(20px); }
input[type="checkbox"]:disabled { opacity: .45; cursor: default; }
label.row:has(> input[type="checkbox"]) { flex-direction: row-reverse; justify-content: space-between; align-items: center; }
</style>

<script>
/* =====================================================================
   PLANIFICA · núcleo
   ===================================================================== */
const KEY = "planifica_v2";
const APP_VERSION = "2.0";
const CATS = ["ejercicio", "idiomas", "lectura", "trabajo", "proyectos", "comida", "desplazamiento", "recuperación", "hogar"];
const CV0 = 0.15; // variabilidad previa (sin datos): 15%
const K_PESO = 5; // w = n/(n+5)
const ALFA = 0.3; // media móvil exponencial
const FAT_SERIE = 0.04; // el ritmo decae 4% por serie

const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const pad = (n) => String(n).padStart(2, "0");
const hm = (m) => {
  m = Math.round(m);
  return pad(Math.floor(m / 60) % 24) + ":" + pad(m % 60);

const tm = (s) => {

function cleanItems(a) {
  return (Array.isArray(a) ? a : [])
    .map((i) => {
      if (!i || typeof i !== "object") return null;
      const n = String(i.n || "")
        .slice(0, 60)
        .trim();
      if (!n) return null;
      if (i.k === "series") {
        const sets = Math.round(+i.sets),
          reps = Math.round(+i.reps);
        if (!(sets >= 1 && sets <= 50 && reps >= 1 && reps <= 1000)) return null;
        return {
          n,
          k: "series",
          sets,
          reps,
          secRep: Math.min(60, Math.max(0.5, +i.secRep || 2.5)),
          rest: Math.min(900, Math.max(0, +i.rest >= 0 ? +i.rest : 60)),
        };
      }
      const min = +i.min;
      return min > 0 && min <= 600 ? { n, k: "tiempo", min } : null;
    })
    .filter(Boolean);
}
function norm(o, raw) {
  if (!o || !Array.isArray(o.tpl) || !Array.isArray(o.logs) || !o.cfg) throw 0;
  if (o.tpl.some((x) => !x || typeof x.id !== "string" || typeof x.name !== "string")) throw 0;
  if (o.v > 6) throw 0; // versión más nueva que esta app: no la degradamos en silencio
  if (raw && (o.v || 0) < 5)
    try {
      copia("pre5", raw); // copia previa a migrar (una sola vez)
    } catch (_) {}
  o.cfg = {
    wake: "06:30",
    sleep: "23:00",
    hard: "00:30",
    theme: null,
    lastBackup: 0,
    accent: null,
    notif: false,
    ...o.cfg,
  };
  ["plan", "cal", "extra", "rm", "add", "ext"].forEach((k) => {
    if (!o[k] || typeof o[k] !== "object" || Array.isArray(o[k])) o[k] = {};
  });
  if (!Array.isArray(o.pend)) o.pend = [];
  o.en = (Array.isArray(o.en) ? o.en : []).filter((e) => e && isFinite(+e.ts) && +e.v >= 1 && +e.v <= 5).slice(-400); // energía: últimos 400 chequeos
  o.logs = o.logs.filter((l) => l && typeof l.date === "string" && typeof l.tid === "string" && isFinite(+l.real)); // descarta registros dañados
  const dias = Object.keys(o.plan).sort(),
    viejo = dk(new Date(Date.now() - 14 * 864e5));
  congelaHd(o); // antes de podar: el cumplimiento de días pasados queda guardado
  dias.forEach((k) => {
    if (k < viejo) delete o.plan[k];
  }); // los planes viejos no se necesitan: el historial está en logs
  o.tpl.forEach((t) => {
    delete t.scale;
    t.id = t.id.replace(/[^\w-]/g, "_");
    if (!CATS.includes(t.cat)) t.cat = "hogar";
    if (!["diaria", "lv", "fs", "demanda"].includes(t.freq)) t.freq = "diaria";
    t.win = String(t.win || "")
      .split(",")
      .map((x) => x.trim())
      .filter((x) => /^([01]?\d|2[0-3]):[0-5]\d$/.test(x))
      .join(",");
    t.cat = String(t.cat || "hogar");
    t.items = cleanItems(t.items);
    t.win = String(t.win || "");
    t.rest = +t.rest || 0;
    t.base = +t.base || 1;
    t.prep = +t.prep || 0;
    t.trans = +t.trans || 0;
    t.energy = +t.energy || 2;
    t.prio = +t.prio || 2;
    t.freq = t.freq || "diaria";
    t.days = Array.isArray(t.days) ? [...new Set(t.days.map(Number).filter((d) => d >= 0 && d <= 6))] : [];
    t.type = t.type || "normal";
    // winD (Fase 5): {día:'HH:MM,HH:MM'} ventana distinta según el día de la semana
    if (t.winD && typeof t.winD === "object" && !Array.isArray(t.winD)) {
      const w = {};
      Object.keys(t.winD).forEach((k) => {
        const v = String(t.winD[k])
          .split(",")
          .map((x) => x.trim())
          .filter((x) => /^([01]?\d|2[0-3]):[0-5]\d$/.test(x))
          .join(",");
        if (+k >= 0 && +k <= 6 && v) w[k] = v;
      });
      if (Object.keys(w).length) t.winD = w;
      else delete t.winD;
    } else delete t.winD;
  });
  if (o.pg !== 2) {
    if (!o.logs.some((l) => l.date === dk())) o.plan = {};
    o.pg = 2;
  }
  delete o.pv;
  if (!Array.isArray(o.goals)) o.goals = [];
  if (!o.hd || typeof o.hd !== "object" || Array.isArray(o.hd)) o.hd = {};
  if (!Array.isArray(o.rev)) o.rev = [];
  o.goals = o.goals.filter((g) => g && typeof g.id === "string" && g.target > 0 && g.u > 0 && /^\d{4}-\d\d-\d\d$/.test(g.date || "")); // v4: metas
  // v5 (Fase 5): trabajo L-V + sábado 4 h; proyectos propios en fin de semana.
  // Solo toca plantillas que siguen sin editar (diaria y sin días fijos) y nunca borra datos.
  if ((o.v || 0) < 5) {
    const f = (id) => o.tpl.find((t) => t.id === id);
    let cambio = false;
    ["fo", "op"].forEach((id) => {
      const t = f(id);
      if (t && t.freq === "diaria" && !t.days.length) {
        t.days = [1, 2, 3, 4, 5];
        cambio = true;
      }

    const ej = f("ej");
    if (ej && ej.win === "06:45" && !ej.winD) {
      ej.winD = { 6: "15:30" }; // sábado: la mañana es para el trabajo
      cambio = true;
    }
    const pr = f("pr");
    if (pr && pr.freq === "diaria" && !pr.days.length) {

      );
    if (cambio && raw) o.note5 = 1; // avisa una vez al cargar
  }
  // v6: notas por día, actividades fijadas (revividas) y ajustes "solo ese día"
  const fe = /^\d{4}-\d{2}-\d{2}$/,
    obj = (x) => (x && typeof x === "object" && !Array.isArray(x) ? x : {}),
    corte = dk(new Date(Date.now() - 30 * 864e5));
  o.notes = obj(o.notes);
  Object.keys(o.notes).forEach((k) => {
    if (!fe.test(k) || typeof o.notes[k] !== "string" || !o.notes[k].trim()) delete o.notes[k];
    else o.notes[k] = o.notes[k].slice(0, 2000);
  });
  o.pin = obj(o.pin);
  Object.keys(o.pin).forEach((k) => {
    o.pin[k] = Array.isArray(o.pin[k]) ? o.pin[k].filter((x) => typeof x === "string") : [];
    if (!fe.test(k) || k < corte || !o.pin[k].length) delete o.pin[k];
  });
  o.ov = obj(o.ov);
  Object.keys(o.ov).forEach((k) => {
    const d = obj(o.ov[k]);
    Object.keys(d).forEach((tid) => {
      const v = obj(d[tid]),
        c = {};
      if (Array.isArray(v.items)) c.items = cleanItems(v.items);
      if (+v.base > 0) c.base = +v.base;
      if ((c.items && c.items.length) || c.base) d[tid] = c;
      else delete d[tid];
    });
    o.ov[k] = d;
    if (!fe.test(k) || k < corte || !Object.keys(d).length) delete o.ov[k];
  });
  Object.keys(o.hd).forEach((k) => {
    const d = o.hd[k];
    if (!/^\d{4}-\d\d-\d\d$/.test(k) || !d || !(+d.pl >= 0) || !(+d.hc >= 0)) delete o.hd[k];
    else o.hd[k] = { pl: +d.pl, hc: Math.min(+d.hc, +d.pl) };
  });
  o.v = 6;
  return o;
}

/* ===== ESTADO: congelar el cumplimiento de días pasados antes de podar planes ===== */
function congelaHd(o) {
  const hoy = dk();
  if (!o.hd || typeof o.hd !== "object" || Array.isArray(o.hd)) o.hd = {};
  Object.keys(o.plan).forEach((k) => {
    const p = o.plan[k];
    if (k >= hoy || o.hd[k] || !Array.isArray(p)) return;
    const pl = p.filter((i) => i && !i.fuera);
    if (pl.length) o.hd[k] = { pl: pl.length, hc: pl.filter((i) => o.logs.some((l) => l.iid === i.iid && l.status === "hecha")).length };
  });
}

/* ===== ALMACENAMIENTO: IndexedDB (cientos de MB) en vez de ~5 MB de localStorage =====
   "state" = estado completo (mismo esquema: exportar/importar no cambia).
   "snap"  = copia de ayer. "copia:auto-AAAA-MM-DD" = copias diarias (se guardan las últimas 7).
   "copia:*" = copias con nombre. Si IndexedDB falla, se usa localStorage (modo reducido). */
const DBN = "planifica",
  DBS = "kv";
let DB = null,
  DBOK = false,
  PBUSY = false,
  PDIRTY = false,
  SNAPDAY = null,
  SAVEERR = false,
  QUIET = 0,
  VER = 0,
  BC = null;
const TABID = Math.random().toString(36).slice(2);

function idbOpen() {
  return new Promise((ok, no) => {
    try {
      const r = indexedDB.open(DBN, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(DBS);
      r.onsuccess = () => ok(r.result);
      r.onerror = () => no(r.error);
      r.onblocked = () => no(new Error("bloqueada"));
    } catch (e) {
      no(e);
    }
  });
}
const kvGet = (k) =>
  new Promise((ok, no) => {
    const q = DB.transaction(DBS).objectStore(DBS).get(k);
    q.onsuccess = () => ok(q.result);
    q.onerror = () => no(q.error);
  });
const kvSet = (k, v) =>
  new Promise((ok, no) => {
    const t = DB.transaction(DBS, "readwrite");
    t.objectStore(DBS).put(v, k);
    t.oncomplete = () => ok();
    t.onerror = () => no(t.error);
    t.onabort = () => no(t.error || new Error("abortada"));
  });
const kvDel = (k) =>
  new Promise((ok, no) => {
    const t = DB.transaction(DBS, "readwrite");
    t.objectStore(DBS).delete(k);
    t.oncomplete = () => ok();
    t.onerror = () => no(t.error);
    t.onabort = () => no(t.error || new Error("abortada"));
  });
const kvKeys = () =>
  new Promise((ok, no) => {
    const q = DB.transaction(DBS).objectStore(DBS).getAllKeys();
    q.onsuccess = () => ok(q.result);
    q.onerror = () => no(q.error);
  });

function copia(nombre, texto) {
  if (DBOK) kvSet("copia:" + nombre, { ts: Date.now(), txt: texto }).catch(() => {});
  else
    try {
      localStorage.setItem(KEY + "_" + nombre, texto);
    } catch (_) {}
}
function save() {
  if (QUIET) return; // vistas previas: no se escribe nada
  S.savedAt = Date.now();
  VER++;
  if (!DBOK) {
    try {
      localStorage.setItem(KEY, JSON.stringify(S));
    } catch (e) {
      toast("No se pudo guardar (almacenamiento lleno o bloqueado)");
    }
    return;
  }
  PDIRTY = true; // escrituras seguidas se juntan en una sola
  if (!PBUSY) flush();
}
/** Conserva solo las 7 copias automáticas más recientes. */
async function podarAuto() {
  try {
    const ks = (await kvKeys()).filter((k) => typeof k === "string" && k.startsWith("copia:auto-")).sort();
    for (const k of ks.slice(0, Math.max(0, ks.length - 7))) await kvDel(k);
  } catch (_) {}
}
async function flush() {
  PBUSY = true;
  try {
    while (PDIRTY) {
      PDIRTY = false;
      const hoy = dk();
      if (SNAPDAY !== hoy) {
        // primera escritura del día: lo de ayer queda de copia
        const sn = await kvGet("snap");
        if (!sn || sn.day !== hoy) {
          const prev = await kvGet("state");
          if (prev) {
            await kvSet("snap", { day: hoy, json: prev });
            await kvSet("copia:auto-" + hoy, { ts: Date.now(), txt: prev });
            await podarAuto();
          }
        }
        SNAPDAY = hoy;
      }
      await kvSet("state", JSON.stringify(S));
      SAVEERR = false;
      if (BC)
        try {
          BC.postMessage({ t: "saved", id: TABID, at: S.savedAt });
        } catch (_) {}
    }
  } catch (e) {
    if (!SAVEERR) toast("No se pudo guardar: almacenamiento lleno o bloqueado. Exporta tu respaldo ya.", 6000);
    SAVEERR = true;
  }
  PBUSY = false;
}
/** Si otra pestaña guarda, esta recarga el estado para no pisarlo. */
function initSync() {
  if (!DBOK || !("BroadcastChannel" in window)) return;
  try {
    BC = new BroadcastChannel("planifica");
    BC.onmessage = async (e) => {
      const m = e.data;
      if (!m || m.t !== "saved" || m.id === TABID || PBUSY || PDIRTY || QUIET) return;
      try {
        const j = await kvGet("state");
        if (!j) return;
        const n = norm(JSON.parse(j));
        if ((n.savedAt || 0) <= (S.savedAt || 0)) return;
        S = n;
        VER++;
        DC.k = null;
        LIX = { r: null, n: -1, m: null };
        applyTheme();
        if ($("#ov").hidden) render();
      } catch (_) {}
    };
  } catch (_) {}
}
/** Lista las copias guardadas dentro de la base (para restaurarlas desde Ajustes). */
async function listaCopias() {
  if (!DBOK) return [];
  const ks = (await kvKeys()).filter((k) => typeof k === "string" && k.startsWith("copia:"));
  const out = [];
  for (const k of ks) {
    try {
      const v = await kvGet(k);
      if (v && v.txt) out.push({ k, ts: v.ts || 0, len: v.txt.length });
    } catch (_) {}
  }
  return out.sort((a, b) => b.ts - a.ts);
}
function nomCopia(k) {
  const n = k.replace(/^copia:/, "");
  if (n.startsWith("auto-")) return "Al empezar el " + fechaTxt(n.slice(5));
  return (
    {
      preimport: "Antes de importar un respaldo",
      corrupto: "Datos dañados (guardados aparte)",
      rescate: "Antes de restablecer",
      pre5: "Antes de actualizar a v5",
      ls_anterior: "Copia del almacenamiento anterior",
    }[n] || n
  );
}

async function boot() {
  let aviso = null,
    ok = false,
    deLS = null;
  try {
    DB = await idbOpen();
    DBOK = true;
  } catch (e) {
    DBOK = false;
  }
  const leer = (txt) => {
    const pj = JSON.parse(txt);
    if (pj && typeof pj === "object" && !Object.keys(pj).length) return seed(); // {} = vacío, no corrupto
    return norm(pj, txt);
  };
  if (DBOK) {
    let j = null,
      errLeer = false;
    for (let i = 0; i < 2; i++) {
      // un fallo de lectura NO es "base vacía": se reintenta y, si persiste, no se escribe nada en la base
      try {
        j = await kvGet("state");
        errLeer = false;
        break;
      } catch (_) {
        errLeer = true;
        await new Promise((r) => setTimeout(r, 300));
      }
    }
    if (errLeer) {
      DBOK = false;
      aviso =
        "No pude leer la base de datos. Para no pisar tus datos no escribiré en ella; reinicia la app y, si sigue, exporta un respaldo.";
    }
    if (j) {
      try {
        S = leer(j);
        ok = true;
      } catch (e) {
        copia("corrupto", String(j));
        try {
          const sn = await kvGet("snap");
          if (sn && sn.json) {
            S = leer(sn.json);
            ok = true;
            aviso = "La copia principal estaba dañada: cargué la de " + sn.day + " (la dañada quedó guardada aparte).";
          }
        } catch (_) {}
      }

  if (e.key === "Escape" && !$("#ov").hidden) {
    closeS();
    return;
  }
  // Trampa de foco: con la hoja abierta, Tab/Shift+Tab no salen de ella
  if (e.key === "Tab" && !$("#ov").hidden) {
    const f = [...$("#sh").querySelectorAll("button,input,select,textarea,[href]")].filter((x) => !x.disabled);
    if (!f.length) return e.preventDefault();
    const a = document.activeElement,
      i = f.indexOf(a);
    if (e.shiftKey && i <= 0) {
      e.preventDefault();
      f[f.length - 1].focus();
    } else if (!e.shiftKey && (i === f.length - 1 || i === -1)) {
      e.preventDefault();
      f[0].focus();
    }
    return;
  }
  // Atajos de teclado (escritorio): 1-5 cambian de pestaña, "n" salta a la captura rápida
  const t = e.target;
  if (e.ctrlKey || e.metaKey || e.altKey || !$("#ov").hidden) return;
  if (t && t.matches && t.matches("input,textarea,select,[contenteditable]")) return;
  if (e.key >= "1" && e.key <= "5") {
    A.tab(["hoy", "sem", "act", "pro", "aju"][+e.key - 1]);
  } else if (e.key === "n" || e.key === "N") {
    e.preventDefault();

function ring(p, size = 76, label = "Progreso") {
  const r = size / 2 - 7,
    c = 2 * Math.PI * r,
    pc = Math.round(Math.max(0, Math.min(1, p || 0)) * 100),
    m = size / 2;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label)} ${pc}%"><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--s3)" stroke-width="8"/><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--ok)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - pc / 100)).toFixed(1)}" transform="rotate(-90 ${m} ${m})"/><text x="${m}" y="${m + 5}" text-anchor="middle" fill="var(--tx)" font-size="${size > 70 ? 16 : 13}" font-weight="800">${pc}%</text></svg>`;
}

function vEn() {
  const n = minNow(),
    w = tm(S.cfg.wake);
  if (n < w || n > SL()) return { card: "", al: [] };
  const hoy = S.en.filter((e) => dk(new Date(e.ts)) === dk()),
    last = hoy[hoy.length - 1],

    card = `<section class="card in"><div class="row sp"><b>¿Cómo está tu energía?</b><span class="mu">${last ? "último chequeo hace " + dur((Date.now() - last.ts) / 6e4) : "sin chequeo hoy"}</span></div><div class="row nw" style="margin-top:10px">${[1, 2, 3, 4, 5].map((v) => `<button class="btn s grow" data-a="en" data-i="${v}" aria-label="Energía ${v} de 5">${v}</button>`).join("")}</div><div class="mu" style="margin-top:8px">1 agotado, 5 a tope. Se pregunta cada 3 h.</div></section>`;
  if (last && last.v <= 2)

    ]);
  const sinComer = lm < 0 ? n - w : n - lm;
  if (sinComer > 240)
    al.push([
      "",
      `<b>Llevas ${(sinComer / 60).toFixed(1)} h sin comer.</b> Sin combustible el foco cae y el entrenamiento rinde menos: come ahora.`,
    ]);
  let ac = 0;
  S.logs
    .filter((l) => l.date === dk() && l.status === "hecha" && !l.sim)
    .sort((a, b) => (a.startTs || 0) - (b.startTs || 0))
    .forEach((l) => {

    ]);
  return { card, al };
}

function gapRow(a, m) {

function blkRow(i, o = {}) {
  const t = etpl(i.tid, dk()),
    l = logOf(i.iid),
    e = i.est,
    act = S.timer && S.timer.iid === i.iid,
    st = serieTxt(t);
  const cls = l ? (l.status === "hecha" ? "done" : "skp") : act ? "act" : "";

        : `<span class="chip wn">omitida</span>`;
  else if (act) chip = '<span class="chip ac">en curso</span>';
  else if (o.hero) chip = '<span class="chip">siguiente</span>';
  const acts =
    l || act || o.hero
      ? ""
      : `<div class="row acts">${S.timer ? "" : `<button class="btn sm a" data-a="start" data-i="${i.iid}">${ic("play", "fill")}Iniciar</button>`}<button class="btn sm s ic-only" data-a="opts" data-i="${i.iid}" aria-label="Más opciones de ${esc(t.name || "la actividad")}">${ic("more", "dots")}</button></div>`;
  return `<div class="tr ${cls}" style="--ac:${catCol(t.cat)}"><div class="tm"><b>${hm(i.start)}</b>${hm(i.start + e.block)}</div><div class="spn"><i class="nd"></i></div><div class="bdy"><div class="row nw sp"><div class="ttl grow">${esc(t.name || "(actividad eliminada)")}</div>${chip}</div>${st ? `<div class="mu clamp">${st}${ajustado(i.tid, dk()) ? ", ajustada hoy" : ""}</div>` : ""}<div class="mu">${dur(e.exp)}, ${esc(t.cat || "")}${e.sc < 1 ? ` <span class="wn">recortada al ${Math.round(e.sc * 100)}%</span>` : ""}</div>${acts}</div></div>`;
}
/** Construye la línea de tiempo del día y devuelve también el hueco más grande (para los pendientes). */
function timeline(pl, nowM, LM) {
  const un = pl.filter((i) => !logOf(i.iid)).sort((a, b) => a.start - b.start),
    nx = !S.timer ? un[0] : null;
  const nowRow = `<div class="tr nowl" aria-label="Ahora, ${hm(nowM)}"><div class="tm">${hm(nowM)}</div><div class="spn"><i class="nd"></i></div><div class="bdy"></div></div>`;
  let c = Math.max(nowM, tm(S.cfg.wake)),
    mx = 0,
    rows = "",
    nowDone = false;
  pl.forEach((i) => {
    if (!logOf(i.iid)) {
      if (!nowDone && i.start >= nowM) {
        rows += nowRow;
        nowDone = true;
      }
      if (i.start - c >= 10) {
        rows += gapRow(c, i.start - c);
        mx = Math.max(mx, i.start - c);
      }
      c = Math.max(c, i.start + i.est.block);
    }
    rows += blkRow(i, { hero: nx && nx.iid === i.iid });
  });
  if (!nowDone) rows += nowRow;
  if (LM - c >= 10) {
    rows += gapRow(c, LM - c);
    mx = Math.max(mx, LM - c);
  }
  return { html: `<div class="tl">${rows}</div>`, mx };
}

/* ----- Pantalla Hoy ----- */
function vHoy() {
  const all = today(),
    pl = all.filter((i) => !i.fuera),
    fu = all.filter((i) => i.fuera),
    LM = limOf(dk()),
    nowM = minNow(),
    avail = Math.max(0, LM - Math.max(tm(S.cfg.wake), nowM)),
    tot = pl.filter((i) => !logOf(i.iid)).reduce((s, i) => s + i.est.block, 0),
    end = pl.length ? pl[pl.length - 1].start + pl[pl.length - 1].est.block : 0,
    over = Math.max(tot - avail, end - LM),
    dn = pl.filter((i) => logOf(i.iid) && logOf(i.iid).status === "hecha").length,
    fuMin = Math.round(fu.reduce((s, i) => s + i.est.block, 0));
  const st = over > 0 ? ["er", "No cabe"] : fu.length ? ["wn", "Recortado"] : avail - tot < 60 ? ["wn", "Ajustado"] : ["ok", "Viable"];
  let r = 0;
  try {
    r = racha();
  } catch (_) {}

  let h = `<section class="card sum"><div class="grow"><div class="lb">Cumplido hoy</div><div class="n">${dn}<small>/${pl.length}</small></div><div class="mu">${hh(tot)} por hacer, ${hh(avail)} hasta dormir</div><div class="row" style="margin-top:10px"><span class="chip ${st[0]}">${st[1]}</span>${r > 0 ? `<span class="chip">${ic("flame")}${r} ${r === 1 ? "día" : "días"} seguidos</span>` : ""}</div></div>${ring(pl.length ? dn / pl.length : 0)}</section>`;

  // Avisos: se juntan y se pliegan
  const AV = [];
  if (over > 0)
    AV.push([
      "e",
      `<b>Plan inviable hoy.</b> Tu día tiene ${hh(tot)} de actividades reales y solo hay ${hh(avail)} disponibles (terminas ${hm(end)} y duermes ${hm(LM)}). Recorta SW, proyectos o lectura, o acepta dormir menos (no recomendado).`,
    ]);
  else if (fu.length)
    AV.push(["", `<b>El día no cabe completo.</b> Lo agendado ocupa ${hh(tot)} de ${hh(avail)} y ${dur(fuMin)} quedaron fuera.`]);
  else if (avail - tot < 60)
    AV.push(["", `<b>Día ajustado.</b> Te quedan ${dur(Math.max(0, avail - tot))} de holgura. Un desplazamiento largo lo rompe.`]);
  const rc = [...new Set(pl.filter((i) => i.est.sc < 1).map((i) => tpl(i.tid).name))];
  if (rc.length)
    AV.push([
      "g",
      `<b>Ajuste automático.</b> Para que todo quepa hoy, ${rc.map(esc).join(", ")} van recortadas. Si quitas algo, recuperan tiempo.`,
    ]);
  if (fu.length)
    AV.push([
      "",
      `<b>No caben antes de dormir (${hm(LM)}):</b> ${[...new Set(fu.map((i) => esc(tpl(i.tid).name)))].join(", ")} (${dur(fuMin)}). ${fu.some((i) => i.p1) ? "<b>Incluye bloques de prioridad 1: hoy no hay tiempo real para todo lo esencial; elige tú qué sacrificas.</b> " : ""}Se descartó primero lo menos prioritario. Si esto pasa a diario, tu rutina no cabe: baja horas de trabajo o mueve proyectos a fin de semana.`,
    ]);
  if (over > 0)
    AV.push(["e", `Ni recortando lo prescindible alcanza: faltan ${dur(over)}. Hay que reducir trabajo o dormir menos; decídelo tú.`]);
  if (fu.length && !(S.ext || {})[dk()] && HD() > SL())
    AV.push([
      "",
      `Puedes extender hasta ${hm(HD())} (dormirías ≈${((tm(S.cfg.wake) + 1440 - HD()) / 60).toFixed(1)} h; no recomendado). <button class="btn sm s" data-a="ext">Extender hoy</button>`,
    ]);
  if (S.logs.length && Date.now() - S.cfg.lastBackup > 6048e5)
    AV.push([
      "",
      `<b>Hace más de 7 días sin respaldo.</b> Tus datos viven en este dispositivo. <button class="btn sm s" data-a="exp">Exportar ahora</button>`,
    ]);
  if (fu.some((i) => i.est.block <= libreDia(dk())))
    AV.push(["g", 'Hay espacio ahora para revivir algo que quedó fuera (abajo, en "Fuera de hoy").']);
  const en = vEn();
  AV.push(...en.al);

  const vc = venc();
  if (vc.length && !S.timer)
    h += `<div class="al"><b>Ya pasó la hora de ${[...new Set(vc.map((i) => esc(tpl(i.tid).name)))].join(", ")}.</b> ¿Las hiciste sin registrarlas? <div><button class="btn sm s" data-a="vdone">Sí, ya hechas</button><button class="btn sm s" data-a="vskip">No, omitir</button></div></div>`;

  h += S.timer ? vTimer() : ahoraHero(pl, nowM);
  h += en.card;
  h += `<div class="qa">${ic("plus")}<input id="qa" type="text" enterkeyhint="done" autocomplete="off" maxlength="120" placeholder="Agregar rápido: Llamar a Pedro 20 min a las 4pm" aria-label="Captura rápida"><button class="btn sm" data-a="qadd">Agregar</button></div><div class="mu qp" id="qp" aria-live="polite"></div>`;
  h += avisosCard(AV);

  h += `<div class="row" style="margin:12px 0 0"><button class="btn sm s" data-a="dadd">${ic("plus")}Agregar</button><button class="btn sm s" data-a="comp">Compromiso</button><button class="btn sm s" data-a="pnew">Pendiente</button><button class="btn sm s ic-only" data-a="menu" aria-label="Más acciones">${ic("more", "dots")}</button></div>`;

  const tl = timeline(pl, nowM, LM);
  h += tl.html;
  if (S.pend.length)
    h += `<section class="card"><h3>Pendientes</h3>${S.pend.map((p) => `<div class="row nw sp" style="padding:6px 0"><div class="grow">${esc(p.name)}<div class="mu">${p.min} min${p.min <= tl.mx ? ", cabe hoy" : ""}</div></div><button class="btn sm" data-a="padd" data-i="${p.id}">A hoy</button><button class="btn sm s ic-only" data-a="pdel" data-i="${p.id}" aria-label="Quitar ${esc(p.name)}">${ic("x")}</button></div>`).join("")}</section>`;
  if (fu.length) {
    h += `<div class="row sp sec"><span>Fuera de hoy</span><button class="btn sm s" data-a="movall">Mover todo a mañana</button></div>`;
    fu.forEach((i) => (h += cardFuera(i, dk())));
  }
  h += notaCard(dk());
  return h;
}

/* ----- Cualquier otro día: futuro = plan editable; pasado = lo registrado ----- */

function vOtro(key) {

    h += `<div class="row" style="margin-bottom:6px"><button class="btn sm s" data-a="dadd">${ic("plus")}Agregar</button>${((S.rm || {})[key] || []).length ? '<button class="btn sm s" data-a="dres">Restaurar quitadas</button>' : ""}</div>`;

  } else {
    const L = S.logs.filter((l) => l.date === key).sort((x, y) => (x.startTs || 0) - (y.startTs || 0)),
      pend = preview(key).filter((i) => !i.fuera && !logOf(i.iid));
    h += `<section class="card pad0"><div class="sec" style="margin:14px 16px 6px">Registrado</div><div class="lst" style="border:0;margin:0">${
      L.length
        ? L.map((l) => {
            const t = S.tpl.find((x) => x.id === l.tid) || { name: "(eliminada)", cat: "" };
            return `<div class="li" style="--ac:${catCol(t.cat)}"><i class="dot"></i><div class="grow"><b>${esc(t.name)}</b><div class="mu ${l.status === "hecha" ? "ok" : "wn"}">${l.status === "hecha" ? "Hecha, " + Math.round(l.real) + " min" : "Omitida"}${l.nocal ? ", anotada a mano" : ""}</div></div>${l.nocal && !l.sim ? `<button class="btn sm s" data-a="logdel" data-i="${esc(l.id)}">Borrar</button>` : ""}</div>`;
          }).join("")

    }</div></section>`;
    if (pend.length)
      h += `<div class="sec">Tocaba y no está registrada</div><div class="lst">${pend.map((i) => `<div class="li" style="--ac:${catCol(etpl(i.tid, key).cat)}"><i class="dot"></i><div class="grow"><b>${esc(etpl(i.tid, key).name || "")}</b><div class="mu">${i.est.exp} min típico</div></div><button class="btn sm" data-a="retro" data-i="${i.iid}">La hice…</button></div>`).join("")}</div>`;
  }
  return h + notaCard(key);
}

/* ----- Calendario ----- */
function tituloVista() {
  const n = new Date();
  if (WV === "sem") {
    n.setDate(n.getDate() + WO * 7 - ((n.getDay() + 6) % 7));

    n.setDate(1);

}
function vSem() {
  return (
    `<div class="row sp nw"><h2 class="pg">${tituloVista()}</h2><div class="row nw"><button class="btn s sm ic-only" data-a="wo" data-i="-1" aria-label="Anterior">${ic("left")}</button><button class="btn s sm" data-a="wo" data-i="0">Hoy</button><button class="btn s sm ic-only" data-a="wo" data-i="1" aria-label="Siguiente">${ic("right")}</button></div></div>
<div style="margin:12px 0">${seg(

<div class="row" style="margin-bottom:8px"><button class="btn sm s" data-a="wcomp">${ic("plus")}Compromiso en varios días</button><button class="btn sm s" data-a="dfecha">Ir a fecha</button></div>` +

  else if (fut.length) h += `<div class="al g"><b>Semana viable.</b> Ningún día desborda y los compromisos respetan su hora.</div>`;
  if (S.goals.length && fut.length) {

  }
  h += '<div class="lst">';
  A.forEach(({ d, k, a }) => {
    let mid,
      x = "";

    } else {
      mid = `<div class="${a.mal ? "wn" : ""}"><b>${hh(a.used)}</b> agendadas, ${dur(Math.max(0, a.free))} libres</div><div class="bar ${a.mal ? "wn" : ""}"><i style="width:${Math.min(100, (a.used / Math.max(1, a.avail)) * 100)}%"></i></div>`;
      x = `<div class="mu">Salud ${hh(a.bal.salud)}, trabajo ${hh(a.bal.trabajo)}, estudio ${hh(a.bal.estudio)}, descanso ${hh(a.bal.descanso)}</div>`;
      if (a.fu.length) x += `<div class="wn">Fuera: ${[...new Set(a.fu.map(nm_))].join(", ")}</div>`;
      if (a.choque.length) x += `<div class="wn">No se respeta la hora de: ${a.choque.map(nm_).join(", ")}</div>`;
      if (a.bajo.length)
        x += `<div class="wn">Alta energía en horas en que sueles estar flojo: ${[...new Set(a.bajo.map(nm_))].join(", ")} (según tus chequeos)</div>`;
      const c = a.fu.length && [...a.pl].reverse().find((i) => tpl(i.tid).prio > 1 && !logOf(i.iid));
      if (c)
        x += `<div style="margin-top:6px"><button class="btn sm s" data-a="wrm" data-i="${c.iid}">Sugerencia: quitar ${nm_(c)} de este día</button></div>`;
    }
    const nota = (S.notes || {})[k] ? ", con nota" : "";

  });
  return h + "</div>";
}
function vMes() {
  const M = mapaMin(),
    b = new Date();
  b.setDate(1);
  b.setMonth(b.getMonth() + WO);
  const y = b.getFullYear(),
    m = b.getMonth(),
    nd = new Date(y, m + 1, 0).getDate(),
    hoy = dk();
  let c = "",
    tot = 0,
    act = 0,
    sin = 0;
  c += ["L", "M", "X", "J", "V", "S", "D"].map((x) => `<div class="h">${x}</div>`).join("");
  for (let i = 0; i < (b.getDay() + 6) % 7; i++) c += "<div></div>";
  for (let d = 1; d <= nd; d++) {
    const k = dk(new Date(y, m, d)),
      v = M[k] || 0;
    tot += v;
    if (v) act++;
    else if (k < hoy) sin++;
    let bg = `color-mix(in srgb,var(--ok) ${Math.min(70, Math.round(v / 6))}%,var(--s3))`,
      mal = false,
      et = `${Math.round(v)} min hechos`;
    if (k >= hoy) {
      const a = analiza(k);
      bg = `color-mix(in srgb,var(--accent) ${Math.round(Math.min(1, a.used / Math.max(1, a.avail)) * 45)}%,var(--s3))`;
      mal = malCal(a);
      et = `${hh(a.used)} agendadas${mal ? ", no cabe todo" : ""}`;
    }
    c += `<button class="mc ${k === hoy ? "hoy" : ""} ${mal ? "mal" : ""}" data-a="goto" data-i="${k}" style="background:${bg}" aria-label="${d}: ${et}">${d}${(S.notes || {})[k] ? "<sup>●</sup>" : ""}</button>`;
  }
  let r = 0;
  for (let i = 0; i < 400; i++) {
    const x = new Date();
    x.setDate(x.getDate() - i);
    if (M[dk(x)]) r++;
    else if (i > 0) break;
  }
  return `<section class="card"><div class="mg">${c}</div><p class="mu" style="margin-bottom:0">Pasado: verde según los minutos hechos. Futuro: color según la carga agendada; borde naranja si sobran 60 min o más fuera, o cae algo prioritario. Toca un día para abrirlo.</p></section><section class="card"><b>${hh(tot)} hechas</b> en ${act} días. ${sin} días pasados sin registros. Días seguidos con actividad: <b>${r}</b>.</section>`;
}
function catCard() {
  const d = kd(28),
    M = {};
  let tot = 0;
  S.logs.forEach((l) => {
    if (l.status === "hecha" && l.date >= d) {
      const c = (S.tpl.find((t) => t.id === l.tid) || {}).cat || "otros";
      M[c] = (M[c] || 0) + l.real;
      tot += l.real;
    }
  });
  const e = Object.entries(M).sort((a, b) => b[1] - a[1]);
  if (!e.length) return "";
  return `<section class="card"><h3>Dónde fue tu tiempo</h3><div class="mu">Últimos 28 días</div>${e.map(([c, m]) => `<div class="cb"><span class="nm">${esc(c)}</span><span class="bar tr"><i style="width:${Math.max(3, Math.round((m / e[0][1]) * 100))}%;background:${catCol(c)}"></i></span><span class="mu tn">${hh(m)}, ${Math.round((m / tot) * 100)}%</span></div>`).join("")}</section>`;
}
function vAnio() {
  const M = mapaMin(),
    y = new Date().getFullYear() + WO,
    H = Array(12).fill(0),
    D = Array(12).fill(0);
  Object.keys(M).forEach((k) => {
    if (+k.slice(0, 4) === y) {
      H[+k.slice(5, 7) - 1] += M[k];
      D[+k.slice(5, 7) - 1]++;
    }
  });
  const mx = Math.max(1, ...H);
  return (
    catCard() +
    `<section class="card"><h3>${y}: horas hechas por mes</h3>${H.map((v, i) => {
      const mn = new Date(y, i, 1);
      return `<div class="row nw" role="button" tabindex="0" data-a="gomes" data-i="${y}-${i + 1}" aria-label="Abrir ${mn.toLocaleDateString("es", { month: "long" })}" style="margin-top:6px;cursor:pointer"><span class="mu" style="width:34px">${mn.toLocaleDateString("es", { month: "short" })}</span><div class="bar grow"><i style="width:${(v / mx) * 100}%"></i></div><span class="mu tn" style="width:84px;text-align:right">${(v / 60).toFixed(0)} h, ${D[i]} d</span></div>`;
    }).join("")}</section>`
  );
}

function vPro() {

const ring2 = (p, l) => `<div style="text-align:center">${ring(p, 78, l)}<div class="mu" style="margin-top:4px">${l}</div></div>`;
function semanasBars(n = 8) {
  const M = mapaMin(),
    out = [],
    base = new Date();
  base.setDate(base.getDate() - ((base.getDay() + 6) % 7));
  for (let w = n - 1; w >= 0; w--) {
    const d0 = new Date(base);
    d0.setDate(base.getDate() - w * 7);
    let m = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(d0);
      d.setDate(d0.getDate() + i);
      m += M[dk(d)] || 0;
    }
    out.push({ d: d0, m });
  }
  return out;
}
function heatCard() {
  const W = 16,
    hoyD = new Date(),
    start = new Date(hoyD),
    M = mapaMin();
  start.setDate(start.getDate() - ((hoyD.getDay() + 6) % 7) - (W - 1) * 7);
  let c = "";
  for (let w = 0; w < W; w++)
    for (let r = 0; r < 7; r++) {
      const d = new Date(start);
      d.setDate(start.getDate() + w * 7 + r);
      const k = dk(d);
      if (k > dk()) {
        c += '<i style="visibility:hidden"></i>';
        continue;
      }
      const x = dia(k);
      let st = "",
        tx = "sin datos";
      if (x.pl) {
        const p = x.hc / x.pl;
        st = `background:color-mix(in srgb,var(--ok) ${Math.round(20 + p * 70)}%,var(--s3))`;
        tx = `${x.hc} de ${x.pl} hechas`;
      } else if (M[k]) {
        st = "background:color-mix(in srgb,var(--ok) 30%,var(--s3))";
        tx = `${Math.round(M[k])} min registrados`;
      }
      c += `<i class="${k === dk() ? "now" : ""}" title="${fechaTxt(k)}: ${tx}" style="${st}"></i>`;
    }
  return `<section class="card"><h3>Últimas 16 semanas</h3><div class="mu" style="margin-bottom:10px">Cada cuadro es un día; cuanto más verde, más de lo planificado cumpliste.</div><div class="heat" role="img" aria-label="Mapa de cumplimiento de las últimas 16 semanas">${c}</div></section>`;
}
function enCard() {
  const E = enHoras(),
    hs = Object.keys(E)
      .map(Number)
      .sort((a, b) => a - b),
    tot = S.en.length;
  if (tot < 6 || !hs.length) return "";
  return `<section class="card"><h3>Tu energía por hora</h3><div class="mu">Promedio de tus ${tot} chequeos (1 a 5).</div><div class="wbars">${hs
    .map((h) => {
      const v = E[h],
        a = v.reduce((x, y) => x + y, 0) / v.length;
      return `<div><span class="tn">${a.toFixed(1)}</span><div class="trk"><i style="height:${(a / 5) * 100}%;opacity:${v.length >= 3 ? 1 : 0.4}"></i></div><span>${h}h</span></div>`;
    })
    .join("")}</div><div class="mu">Las barras tenues tienen menos de 3 chequeos y no cuentan para las reglas.</div></section>`;
}
function vHab() {

  h += `<section class="card"><div class="row sp"><h3>Nivel ${lv}, ${rango(lv)}</h3><span class="chip tn">${x} XP</span></div><div class="bar ac"><i style="width:${Math.min(100, ((x - needXP(lv)) / (needXP(lv + 1) - needXP(lv))) * 100)}%"></i></div><div class="mu">Faltan ${needXP(lv + 1) - x} XP para el siguiente nivel. Desbloqueos: nivel 2 activa el coach; nivel 3, la revisión mensual.</div><details class="fold" id="fold-xp" style="margin:10px 0 0"><summary><span>Cómo se gana XP</span></summary><div class="fb mu">+10 por actividad hecha dentro de ±25% del tiempo estimado (tope 120 por día). +25 por día cumplido. +50, +100 y +200 al llegar a 7, 14 y 30 días de racha. +30 por semana con realismo ≥75%. <b>Nada</b> por crear actividades, modo mínimo ni registros "ya hechas": el XP se deriva del historial y no se puede inflar.</div></details></section>`;

  }</section>`;
  h +=
    `<section class="card"><h3>Coach</h3>` +
    (lv < 2
      ? `<div class="mu">Se desbloquea en el nivel 2 (${needXP(2)} XP).</div>`

      .slice(-3)

      .map((r) => `<div class="mu" style="padding:2px 0">${r.date}: ${esc(r.txt)}</div>`)
      .join("")}</section>`;
  return h;
}

/* ----- Metas y simulador ----- */
function curvas(o, ad) {
  const A = { opt: 1, real: ad, pes: ad * 0.7 },
    mx = acum(o, 1, 52) || 1;
  const P = (k) =>
    Array.from({ length: 53 }, (_, w) => `${(30 + (w / 52) * 640).toFixed(1)},${(190 - (acum(o, A[k], w) / mx) * 170).toFixed(1)}`).join(
      " ",
    );
  const grid = [0.25, 0.5, 0.75]
    .map((f) => `<line x1="30" x2="670" y1="${190 - f * 170}" y2="${190 - f * 170}" stroke="var(--bd)" stroke-dasharray="3 5"/>`)
    .join("");
  return `<svg viewBox="0 0 700 215" width="100%" role="img" aria-label="Volumen acumulado en 12 meses: plan perfecto frente a tu ritmo real">${grid}<line x1="30" y1="190" x2="670" y2="190" stroke="var(--bd)"/><line x1="30" y1="20" x2="30" y2="190" stroke="var(--bd)"/>${["opt", "real", "pes"].map((k) => `<polyline fill="none" stroke="${k === "opt" ? "var(--ok)" : k === "real" ? "var(--tx)" : "var(--wn)"}" stroke-width="3" stroke-linejoin="round" ${k === "pes" ? 'stroke-dasharray="6 5"' : ""} points="${P(k)}"/>`).join("")}<text x="34" y="14" fill="var(--mu)" font-size="12">${Math.round(mx)} ${esc(o.l)} (tope a 12 meses)</text><text x="670" y="208" text-anchor="end" fill="var(--mu)" font-size="12">semanas →</text></svg>`;
}
function vSim() {
  const o = SF;
  let h = `<section class="card"><h3>Simulador: ¿qué pasa si…?</h3>
<label class="lb">Actividad<select id="s_t"><option value="">Personalizada</option>${S.tpl.map((t) => `<option value="${esc(t.id)}" ${t.id === o.tid ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select></label>
<div class="g2"><label class="lb">Veces por semana<input type="number" inputmode="decimal" id="s_f" value="${o.f}" min="0.5" max="7" step="0.5"></label><label class="lb">Minutos por sesión (vacío = estimado)<input type="number" inputmode="numeric" id="s_m" value="${o.m}" min="1"></label>
<label class="lb">Unidades por sesión<input type="number" inputmode="numeric" id="s_u" value="${o.u}" min="1"></label><label class="lb">Unidad<input id="s_l" value="${esc(o.l)}"></label></div>
<label class="lb">Mejora mensual de la unidad (%, 0 = sin progresión)<input type="number" inputmode="decimal" id="s_j" value="${o.j}" min="0" max="10" step="0.5"></label><button class="btn" data-a="simu">Simular</button></section>`;
  if (!o.ok) return h;

  ["opt", "real", "pes"].forEach((k) => {
    h += `<tr style="border-top:1px solid var(--bd)"><td style="padding:8px 8px 8px 0"><b>${ESC[k][0]}</b><br><span class="mu">${Math.round(A[k] * 100)}%</span></td>${[

  return h;

function vMet() {

<div class="al ${c}"><b>Dictamen: ${d.vd}.</b> Necesitas ${d.fN.toFixed(1)} sesiones por semana planificadas (${d.hS.toFixed(1)} h) con tu adherencia (${Math.round(d.ad.a * 100)}%, ${d.ad.txt}). Tienes ~${Math.round((d.free / 60) * 10) / 10} h libres en los próximos 7 días${d.ratio > 1 ? ": no caben" : ""}.</div>

  });
  return h + vSim();

    // Historial simulado determinista (generador congruencial)
    S.logs = S.logs.filter((l) => !l.sim);
    rebuildCal();
    let sd = 7;
    const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
    S.tpl.forEach((t) => {
      const hid = {
        desplazamiento: [1.5, 0.35],
        recuperación: [1.6, 0.4],
        idiomas: [1.2, 0.15],
        ejercicio: [1.15, 0.1],
      }[t.cat] || [1.25, 0.15];
      for (let d = 12; d >= 1; d--) {
        const real = Math.max(1, Math.round((baseOf(t) + +t.prep) * hid[0] * (1 + (rnd() - 0.5) * 2 * hid[1])));
        const dt = new Date();
        dt.setDate(dt.getDate() - d);
        const e = estimate(t, 12);
        addLog({
          id: "s" + t.id + d,
          iid: "sim",
          tid: t.id,
          date: dk(dt),
          real,
          est: e.exp,
          diff: 3,
          energy: 3,
          mood: 3,
          status: "hecha",
          sim: true,
        });
      }
    });
    rp();
    toast("Historial simulado. Mira cómo cambian rangos y confianza");
    render();
  },
  clr() {
    ask("¿Borrar TODO el historial (incluye lo real) y la calibración?", () => {
      S.logs = [];
      S.cal = {};
      rp();
      render();
    });
  },
};

function moverInst(iid, dst) {
  const m = iid.split("@"),
    tid = m[0],
    key = m[1].split("#")[0],
    k = m[1].split("#")[1];
  if (!FE.test(dst) || dst < dk()) return "Elige hoy o una fecha futura";
  if (dst === key) return "Esa ya es su fecha";
  if (logOf(iid)) return "Ya está registrada: no se puede mover";
  if (S.timer && S.timer.iid === iid) return "Termina la actividad en curso primero";
  S.rm = S.rm || {};
  S.add = S.add || {};
  S.extra = S.extra || {};
  S.ov = S.ov || {};
  const src = (key === dk() ? today() : preview(key)).find((x) => x.iid === iid),
    w = (src && src.w) || "",
    ex = (S.extra[key] || []).findIndex((x) => x.id === tid);
  if (ex >= 0) {
    const o = S.extra[key].splice(ex, 1)[0];
    if (!S.extra[key].length) delete S.extra[key];
    (S.extra[dst] = S.extra[dst] || []).push(o);
  } else {
    const ai = (S.add[key] || []).findIndex((a) => a.tid === tid && String(a.k) === k);
    if (ai >= 0) S.add[key].splice(ai, 1);
    else (S.rm[key] = S.rm[key] || []).push(tid + "#" + k);
    (S.add[dst] = S.add[dst] || []).push({ tid, k: "m" + (Date.now() % 1e6), ...(w ? { w } : {}) });
    const ov = (S.ov[key] || {})[tid];
    if (ov) (S.ov[dst] = S.ov[dst] || {})[tid] = JSON.parse(JSON.stringify(ov));
  }
  [key, dst].forEach((x) => {
    if (x === dk()) genPlan(x);
  });
  save();
  return null;
}
